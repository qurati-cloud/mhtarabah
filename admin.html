<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><style>body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #efb36d;border-radius:16px;padding:20px;margin:15px 0}button,select,input{font:inherit;padding:10px;border:1px solid #e6ad65;border-radius:8px}button{background:#ffdfa9;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:240px;font:15px monospace;direction:ltr}article{padding:12px;border-bottom:1px solid #eee} .section-link{display:block;text-align:center;padding:18px 8px;border:1px solid #e6ad65;border-radius:12px;background:#fff5e3;color:#463426;text-decoration:none;font-weight:bold} [hidden]{display:none!important}</style><main><h1 id="title">لوحة الإدارة</h1><p id="status" role="status">جارٍ التحقق من الصلاحيات...</p><section id="users" hidden><h2>العائلات والمستخدمون</h2><p id="familyStats"></p><div id="list"></div></section><section id="content" hidden><h2>المحتوى</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"><a class="section-link" href="awrad.html">الأوراد</a><a class="section-link" href="math.html">العمليات الحسابية</a><a class="section-link" href="word-problems.html">المسائل الحسابية</a><a class="section-link" href="games.html">العواصم</a><a class="section-link" href="daily.html">الأعمال اليومية</a><a class="section-link" href="index.html">نصوص الموقع والرئيسية</a><a class="section-link" href="prayer.html">برنامج الصلاة</a><a class="section-link" href="quran.html">القرءان</a></div><div hidden><select id="key"><option value="texts">نصوص الموقع</option></select><button id="load">تحميل</button></div><p>افتح القسم المطلوب لتعديل محتواه مباشرة.</p><div id="fields"></div><textarea id="value" hidden></textarea><button id="save" hidden>حفظ المحتوى</button></section></main><script type="module" src="auth/navigation.js"></script><script type="module">
import {connect} from './auth/firebase.js';
const $=id=>document.getElementById(id),status=$('status');
let model={};
function draw(){const root=$('fields');root.replaceChildren();function field(parent,obj,key){const v=obj[key];const row=document.createElement('div');row.style.cssText='padding:8px;border-bottom:1px solid #eee';const label=document.createElement('label');label.textContent=({title:'العنوان',text:'النص',count:'عدد التكرار',question:'السؤال',answer:'الإجابة',options:'الخيارات',value:'المحتوى',intro:'المقدمة',morning:'الصباح',evening:'المساء'})[key]||key;row.append(label);if(v!==null&&typeof v==='object'){for(const k of Object.keys(v))field(row,v,k);if(Array.isArray(v)&&v.length){const b=document.createElement('button');b.textContent='إضافة عنصر';b.onclick=()=>{const sample=v[0];const blank=x=>Array.isArray(x)?x.map(blank):x&&typeof x==='object'?Object.fromEntries(Object.entries(x).map(([k,y])=>[k,k==='id'?crypto.randomUUID():blank(y)])):typeof x==='number'?1:typeof x==='boolean'?false:'';v.push(blank(sample));draw()};row.append(b)}}else{const input=document.createElement(typeof v==='string'&&v.length>80?'textarea':'input');input.style.cssText='display:block;width:100%;box-sizing:border-box;min-height:36px;direction:rtl';if(typeof v==='boolean'){input.type='checkbox';input.checked=v;input.onchange=()=>obj[key]=input.checked}else{input.value=v??'';input.oninput=()=>obj[key]=typeof v==='number'?Number(input.value):input.value}row.append(input)}if(Array.isArray(obj)){const b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{if(confirm('حذف هذا العنصر؟')){obj.splice(Number(key),1);draw()}};row.append(b)}parent.append(row)}for(const k of Object.keys(model))field(root,model,k);if(!Object.keys(model).length)root.textContent='لا يوجد محتوى محفوظ لهذا القسم بعد. استخدم التحرير المباشر في صفحة القسم عند توفره.'}

try{const {auth,authApi,data,db}=await connect();authApi.onAuthStateChanged(auth,async u=>{ $('users').hidden=true;$('content').hidden=true;if(!u?.emailVerified){status.textContent='ينبغي تسجيل الدخول بحساب موثق';return}try{const role=u.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',u.uid))).data()?.role;if(!['admin','editor'].includes(role)){status.textContent='لا تملك صلاحية الإدارة';return}$('title').textContent=role==='admin'?'لوحة المدير':'لوحة المحرر';status.textContent='تم التحقق من الصلاحية';$('content').hidden=false;
$('load').onclick=async()=>{try{const k=$('key').value;const snap=await data.getDoc(data.doc(db,'siteContent',k));if(snap.exists())$('value').value=JSON.stringify(snap.data(),null,2);else if(['math','word-problems','capitals'].includes(k)){const res=await fetch(k+'-questions.json');if(!res.ok)throw Error('تعذر تحميل الأسئلة');$('value').value=JSON.stringify({value:await res.json()},null,2)}else $('value').value='{}';model=JSON.parse($('value').value);draw();status.textContent='تم التحميل'}catch(e){status.textContent=e.message}};
$('save').onclick=async()=>{try{const v=model;if(!v||Array.isArray(v)||typeof v!=='object')throw Error('ينبغي إدخال كائن JSON');await data.setDoc(data.doc(db,'siteContent',$('key').value),v);status.textContent='حُفظ المحتوى في قاعدة البيانات'}catch(e){status.textContent=e.message}};
if(role==='admin'){$('users').hidden=false;const entries=new Map([[u.uid,{email:u.email}]]),errors=[];for(const c of ['directory','families']){try{const snap=await data.getDocs(data.collection(db,c));for(const d of snap.docs)entries.set(d.id,{...entries.get(d.id),...d.data()})}catch(e){errors.push(c+': '+e.code)}}$('list').replaceChildren();let total=0;for(const [uid,v] of entries){const row=document.createElement('article');const name=document.createElement('h3');name.textContent='البريد الإلكتروني للأهل: '+(v.email||'غير مسجل');row.append(name);const select=document.createElement('select');for(const [k,l] of [['user','مستخدم'],['editor','محرر'],['admin','مدير']])select.add(new Option(l,k));const owner=v.email==='quraaty@gmail.com';try{select.value=owner?'admin':(await data.getDoc(data.doc(db,'roles',uid))).data()?.role||'user'}catch(e){select.disabled=true;errors.push('تعذر قراءة الدور')}const b=document.createElement('button');b.textContent=owner?'المدير الأساسي':'حفظ الدور';b.disabled=owner||select.disabled;select.disabled=owner||select.disabled;b.onclick=async()=>{try{await data.setDoc(data.doc(db,'roles',uid),{role:select.value});status.textContent='حُفظ الدور'}catch(e){status.textContent=e.message}};row.append(select,b);try{const profiles=await data.getDocs(data.collection(db,'families',uid,'profiles'));total+=profiles.size;const heading=document.createElement('h4');heading.textContent='الأولاد المسجلون: '+profiles.size;row.append(heading);for(const p of profiles.docs){const x=p.data();const box=document.createElement('div');box.style.cssText='background:#fff8eb;border-radius:10px;padding:12px;margin:8px 0';for(const [label,value] of [['الاسم',x.firstName||x.name],['اسم العائلة',x.lastName],['الجنس',x.gender==='male'?'ذكر':x.gender==='female'?'أنثى':null],['تاريخ الميلاد',x.birthDate]]){const line=document.createElement('div');line.textContent=label+': '+(value||'غير مسجل');box.append(line)}row.append(box)}}catch(e){const p=document.createElement('p');p.textContent='تعذر تحميل ملفات الأولاد: '+e.code;row.append(p);errors.push('ملفات الأولاد')}$('list').append(row)}$('familyStats').textContent='العائلات الظاهرة: '+entries.size+' | الأولاد: '+total+(errors.length?' — بعض البيانات تعذر تحميلها':'');if(errors.length)status.textContent=errors.join(' · ');}}catch(e){status.textContent=e.message}})}catch(e){status.textContent=e.message}
</script></html>
