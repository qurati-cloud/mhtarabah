<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><style>body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #efb36d;border-radius:16px;padding:20px;margin:15px 0}button,select,input{font:inherit;padding:10px;border:1px solid #e6ad65;border-radius:8px}button{background:#ffdfa9;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:240px;font:15px monospace;direction:ltr}article{padding:12px;border-bottom:1px solid #eee}</style><main><h1 id="title">لوحة الإدارة</h1><p id="status" role="status">جارٍ التحقق من الصلاحيات...</p><section id="users" hidden><h2>العائلات والمستخدمون</h2><div id="list"></div></section><section id="content" hidden><h2>المحتوى</h2><select id="key"><option value="awrad">الأوراد</option><option value="math">العمليات الحسابية</option><option value="word-problems">المسائل الحسابية</option><option value="capitals">العواصم</option><option value="texts">نصوص الموقع</option></select> <button id="load">تحميل</button><p>محرر بيانات المحتوى (JSON)</p><textarea id="value"></textarea><button id="save">حفظ المحتوى</button></section></main><script type="module" src="auth/navigation.js"></script><script type="module">
import {connect} from './auth/firebase.js';
const $=id=>document.getElementById(id),status=$('status');
try{const {auth,authApi,data,db}=await connect();authApi.onAuthStateChanged(auth,async u=>{ $('users').hidden=true;$('content').hidden=true;if(!u?.emailVerified){status.textContent='ينبغي تسجيل الدخول بحساب موثق';return}try{const role=u.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',u.uid))).data()?.role;if(!['admin','editor'].includes(role)){status.textContent='لا تملك صلاحية الإدارة';return}$('title').textContent=role==='admin'?'لوحة المدير':'لوحة المحرر';status.textContent='تم التحقق من الصلاحية';$('content').hidden=false;
$('load').onclick=async()=>{try{const k=$('key').value;const snap=await data.getDoc(data.doc(db,'siteContent',k));if(snap.exists())$('value').value=JSON.stringify(snap.data(),null,2);else if(['math','word-problems','capitals'].includes(k)){const res=await fetch(k+'-questions.json');if(!res.ok)throw Error('تعذر تحميل الأسئلة');$('value').value=JSON.stringify({value:await res.json()},null,2)}else $('value').value='{}';status.textContent='تم التحميل'}catch(e){status.textContent=e.message}};
$('save').onclick=async()=>{try{const v=JSON.parse($('value').value);if(!v||Array.isArray(v)||typeof v!=='object')throw Error('ينبغي إدخال كائن JSON');await data.setDoc(data.doc(db,'siteContent',$('key').value),v);status.textContent='حُفظ المحتوى في قاعدة البيانات'}catch(e){status.textContent=e.message}};
if(role==='admin'){$('users').hidden=false;const entries=new Map();for(const c of ['directory','families']){try{const snap=await data.getDocs(data.collection(db,c));for(const d of snap.docs)entries.set(d.id,d.data())}catch(e){status.textContent='تعذر تحميل '+c+': '+e.message}}$('list').replaceChildren();for(const [uid,v] of entries){const row=document.createElement('article');const name=document.createElement('p');name.textContent=v.email||uid;row.append(name);const select=document.createElement('select');for(const [k,l] of [['user','مستخدم'],['editor','محرر'],['admin','مدير']])select.add(new Option(l,k));select.value=(await data.getDoc(data.doc(db,'roles',uid))).data()?.role||'user';const b=document.createElement('button');b.textContent='حفظ الدور';b.onclick=async()=>{try{await data.setDoc(data.doc(db,'roles',uid),{role:select.value});status.textContent='حُفظ الدور'}catch(e){status.textContent=e.message}};row.append(select,b);const profiles=await data.getDocs(data.collection(db,'families',uid,'profiles'));for(const p of profiles.docs){const item=document.createElement('p');const x=p.data();item.textContent=[x.name,x.gender==='male'?'ذكر':x.gender==='female'?'أنثى':'',x.birthDate].filter(Boolean).join(' · ');row.append(item)}$('list').append(row)}}}catch(e){status.textContent=e.message}})}catch(e){status.textContent=e.message}
</script></html>
