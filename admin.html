<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><style>body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:auto;padding:20px}section{background:white;border:1px solid #efb36d;border-radius:16px;padding:20px;margin:15px 0}button,select,input{font:inherit;padding:10px;border:1px solid #e6ad65;border-radius:8px}button{background:#ffdfa9;cursor:pointer}textarea{box-sizing:border-box;width:100%;min-height:240px;font:15px monospace;direction:ltr}article{padding:12px;border-bottom:1px solid #eee} .section-link{display:block;text-align:center;padding:18px 8px;border:1px solid #e6ad65;border-radius:12px;background:#fff5e3;color:#463426;text-decoration:none;font-weight:bold} [hidden]{display:none!important}#users{padding:clamp(12px,3vw,24px)} #users h2,#users h3{margin:0 0 12px}
.admin-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.admin-grid label{display:grid;gap:5px} .admin-grid input,.admin-grid select{width:100%;box-sizing:border-box}
#metrics{margin:16px 0}.metric-card,.child-card{background:#fff8eb;border-radius:10px;padding:12px}
#list details,#provision{border:1px solid #ecd5b7;border-radius:12px;padding:12px;margin:12px 0}
#list summary,#provision summary{cursor:pointer;font-weight:bold;overflow-wrap:anywhere}
.admin-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.admin-actions a{color:#593a20} #list .child-card{margin:8px 0}
#users dialog{border:1px solid #efb36d;border-radius:12px;max-width:min(400px,85vw)}
#users dialog label{display:grid;gap:5px;margin:8px 0} #users fieldset{margin:12px 0;border:1px solid #ecd5b7;border-radius:9px}
#users table{width:100%;border-collapse:collapse} #users th,#users td{text-align:start;padding:4px 0}
</style><main><h1 id="title">لوحة الإدارة</h1><p id="status" role="status">جارٍ التحقق من الصلاحيات...</p><section id="users" hidden>
  <h2>العائلات والمستخدمون</h2>
  <div id="metrics" class="admin-grid"></div>
  <details id="provision">
    <summary>إضافة عائلة</summary>
    <form id="provisionForm">
      <div class="admin-grid">
        <label>اسم ولي الأمر<input name="parentName" maxlength="80" required></label>
        <label>البريد الإلكتروني<input name="email" type="email" maxlength="254" required></label>
        <label>رقم واتساب مع رمز البلد<input name="phone" type="tel" dir="ltr" pattern="[+][1-9][0-9]{6,14}" placeholder="+961…"></label>
        <label>بلد التسجيل<select name="country" required><option value="">اختر البلد</option></select></label>
      </div>
      <div id="provisionChildren"></div>
      <div class="admin-actions">
        <button id="anotherChild" type="button">إضافة ولد آخر</button>
        <button type="submit">إنشاء الحساب</button>
      </div>
    </form>
    <div id="invitation" class="admin-actions"></div>
  </details>
  <template id="childTemplate">
    <fieldset>
      <legend>ملف ولد</legend>
      <div class="admin-grid">
        <label>الاسم<input name="firstName" maxlength="40" required></label>
        <label>اسم العائلة<input name="lastName" maxlength="40" required></label>
        <label>الجنس<select name="gender" required><option value="">اختر</option><option value="male">ذكر</option><option value="female">أنثى</option></select></label>
        <label>تاريخ الميلاد<input name="birthDate" type="date" required></label>
      </div>
      <button type="button" class="remove-child">إزالة هذا الملف</button>
    </fieldset>
  </template>
  <div class="admin-grid">
    <label>بحث بالاسم أو البريد أو الهاتف<input id="familySearch" type="search"></label>
    <label>البلد<select id="countryFilter"><option value="">كل البلدان</option></select></label>
    <label>سنة الميلاد<select id="birthYearFilter"><option value="">كل السنوات</option></select></label>
    <label>مصدر التسجيل<select id="sourceFilter"><option value="">كل المصادر</option></select></label>
    <label>الترتيب<select id="familySort">
      <option value="newest">التسجيل من الأحدث إلى الأقدم</option><option value="oldest">التسجيل من الأقدم إلى الأحدث</option>
      <option value="emailAsc">البريد A–Z</option><option value="emailDesc">البريد Z–A</option>
      <option value="parentAsc">اسم ولي الأمر تصاعديًا</option><option value="parentDesc">اسم ولي الأمر تنازليًا</option>
      <option value="childAsc">اسم الولد تصاعديًا</option><option value="childDesc">اسم الولد تنازليًا</option>
      <option value="olderChild">الأولاد من الأكبر إلى الأصغر</option><option value="youngerChild">الأولاد من الأصغر إلى الأكبر</option>
    </select></label>
  </div>
  <p id="familyStats" role="status"></p>
  <div id="list"></div>
</section><section id="content" hidden><h2>المحتوى</h2><div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px"><a class="section-link" href="awrad.html">الأوراد</a><a class="section-link" href="math.html">العمليات الحسابية</a><a class="section-link" href="word-problems.html">المسائل الحسابية</a><a class="section-link" href="games.html">العواصم</a><a class="section-link" href="runner.html">سباق النجوم</a><a class="section-link" href="runner-online.html">إدارة عبارات المحادثة</a><a class="section-link" href="daily.html">الأعمال اليومية</a><a class="section-link" href="index.html">نصوص الموقع والرئيسية</a><a class="section-link" href="prayer.html">برنامج الصلاة</a><a class="section-link" href="quran.html">القرءان</a></div><div hidden><select id="key"><option value="texts">نصوص الموقع</option></select><button id="load">تحميل</button></div><p>افتح القسم المطلوب لتعديل محتواه مباشرة.</p><div id="fields"></div><textarea id="value" hidden></textarea><button id="save" hidden>حفظ المحتوى</button></section></main><script type="module" src="auth/navigation.js"></script><script type="module">
import {connect} from './auth/firebase.js';
import {mountFamilyAdmin} from './auth/admin-families.js';
const $=id=>document.getElementById(id),status=$('status');
let model={}, stopFamilies;
function draw(){const root=$('fields');root.replaceChildren();function field(parent,obj,key){const v=obj[key];const row=document.createElement('div');row.style.cssText='padding:8px;border-bottom:1px solid #eee';const label=document.createElement('label');label.textContent=({title:'العنوان',text:'النص',count:'عدد التكرار',question:'السؤال',answer:'الإجابة',options:'الخيارات',value:'المحتوى',intro:'المقدمة',morning:'الصباح',evening:'المساء'})[key]||key;row.append(label);if(v!==null&&typeof v==='object'){for(const k of Object.keys(v))field(row,v,k);if(Array.isArray(v)&&v.length){const b=document.createElement('button');b.textContent='إضافة عنصر';b.onclick=()=>{const sample=v[0];const blank=x=>Array.isArray(x)?x.map(blank):x&&typeof x==='object'?Object.fromEntries(Object.entries(x).map(([k,y])=>[k,k==='id'?crypto.randomUUID():blank(y)])):typeof x==='number'?1:typeof x==='boolean'?false:'';v.push(blank(sample));draw()};row.append(b)}}else{const input=document.createElement(typeof v==='string'&&v.length>80?'textarea':'input');input.style.cssText='display:block;width:100%;box-sizing:border-box;min-height:36px;direction:rtl';if(typeof v==='boolean'){input.type='checkbox';input.checked=v;input.onchange=()=>obj[key]=input.checked}else{input.value=v??'';input.oninput=()=>obj[key]=typeof v==='number'?Number(input.value):input.value}row.append(input)}if(Array.isArray(obj)){const b=document.createElement('button');b.textContent='حذف';b.onclick=()=>{if(confirm('حذف هذا العنصر؟')){obj.splice(Number(key),1);draw()}};row.append(b)}parent.append(row)}for(const k of Object.keys(model))field(root,model,k);if(!Object.keys(model).length)root.textContent='لا يوجد محتوى محفوظ لهذا القسم بعد. استخدم التحرير المباشر في صفحة القسم عند توفره.'}

try{const connection=await connect();const {auth,authApi,data,db}=connection;authApi.onAuthStateChanged(auth,async u=>{ stopFamilies?.(); $('users').hidden=true;$('content').hidden=true;if(!u?.emailVerified){status.textContent='ينبغي تسجيل الدخول بحساب موثق';return}try{const role=u.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',u.uid))).data()?.role;if(!['admin','editor'].includes(role)){status.textContent='لا تملك صلاحية الإدارة';return}$('title').textContent=role==='admin'?'لوحة المدير':'لوحة المحرر';status.textContent='تم التحقق من الصلاحية';$('content').hidden=false;
$('load').onclick=async()=>{try{const k=$('key').value;const snap=await data.getDoc(data.doc(db,'siteContent',k));if(snap.exists())$('value').value=JSON.stringify(snap.data(),null,2);else if(['math','word-problems','capitals'].includes(k)){const res=await fetch(k+'-questions.json');if(!res.ok)throw Error('تعذر تحميل الأسئلة');$('value').value=JSON.stringify({value:await res.json()},null,2)}else $('value').value='{}';model=JSON.parse($('value').value);draw();status.textContent='تم التحميل'}catch(e){status.textContent=e.message}};
$('save').onclick=async()=>{try{const v=model;if(!v||Array.isArray(v)||typeof v!=='object')throw Error('ينبغي إدخال كائن JSON');await data.setDoc(data.doc(db,'siteContent',$('key').value),v);status.textContent='حُفظ المحتوى في قاعدة البيانات'}catch(e){status.textContent=e.message}};
if(role==='admin' && auth.currentUser?.uid===u.uid){
  $('users').hidden=false;
  stopFamilies=mountFamilyAdmin(connection,u);
}
}catch(e){status.textContent=e.message}})}catch(e){status.textContent=e.message}
</script></html>
