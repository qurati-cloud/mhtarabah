<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffb45f">
<title>مسائل حسابية | محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Tahoma,Arial,sans-serif;
 background:#fff8ef;color:#493627
}
header{
 background:linear-gradient(135deg,#ffad5b,#ffe0a0);
 text-align:center;padding:15px;border-radius:0 0 28px 28px
}
header img{display:block;max-height:125px;max-width:80%;margin:auto;object-fit:contain}
header h1{font-size:27px;margin:8px}
main{max-width:850px;margin:25px auto;padding:0 15px}
.panel{
 background:white;padding:24px;border-radius:24px;
 box-shadow:0 6px 24px #70431312
}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h2{margin:12px 0}
a,button{
 font:inherit;border:0;border-radius:14px;padding:13px 17px;
 background:#ffdfb0;color:#493627;font-weight:bold;
 text-decoration:none;cursor:pointer
}
button:disabled{opacity:.5;cursor:default}
.progress{height:13px;background:#eee1d0;border-radius:20px;overflow:hidden;margin:20px 0}
#bar{height:100%;width:0;background:#e69b40}
#stats{font-size:15px;color:#80634c}
#question{
 font-size:clamp(21px,4vw,30px);
 line-height:1.9;text-align:center;margin:28px 0
}
.choices{
 display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
 gap:12px
}
.choice{
 min-height:85px;background:#fff1da;border:2px solid #efcb9c;
 font-size:clamp(19px,3vw,25px)
}
.choice.correct{background:#ccefc9;border-color:#429d49}
.choice.wrong{background:#ffd4d4;border-color:#d64c4c}
#message{
 min-height:50px;text-align:center;font-size:20px;
 font-weight:bold;margin:20px 0
}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.footer{text-align:center;padding:25px;color:#8b715b}
@media(max-width:520px){
 .panel{padding:15px}
 .choices{gap:9px}
 .choice{min-height:75px}
}
</style>
<link rel="stylesheet" href="arcade/quiz.css">
</head>
<body>
<div style="text-align:center;padding:12px 16px"><h1>مسائل حسابية</h1></div>
<main>
<section class="panel quiz-panel" data-theme="story">
<div class="top">

<h2>مسائل حسابية</h2>
<strong id="level"></strong>
</div>
<div class="progress"><div id="bar"></div></div>
<div id="stats"></div>
<h3 id="question">جار تحميل الأسئلة...</h3>
<div class="choices" id="choices"></div>
<div id="message" aria-live="polite"></div>
<div class="actions">
<button data-text-key="word-problems.html:button:previous" id="previous">السؤال السابق</button>
<button data-text-key="word-problems.html:button:next" id="next">السؤال التالي</button>
<button data-text-key="word-problems.html:button:retry" id="retry">إعادة المحاولة</button>
</div>
</section>
</main>
<div class="footer">محمد وحبيبة</div>

<script type="module">
window.mhGameTextDefaults={"questionNumber":"السؤال {current} من {total}","progress":"الأسئلة المنجزة: {completed} من {total} | ⭐ {completed}","answered":"أجبت عن هذا السؤال","wrong":"الإجابة غير صحيحة، حاول مرة أخرى","complete":"🏆 أحسنت! أنهيت جميع الأسئلة!","correct":"⭐ أحسنت! إجابة صحيحة","already":"لقد أجبت عن هذا السؤال بالفعل","loadError":"تعذر تحميل الأسئلة","missing":"تأكد من وجود ملف الأسئلة على الموقع"};
function gameText(id){return window.mhGameTextValues?.[location.pathname.split('/').pop()+':message:'+id] ?? window.mhGameTextDefaults[id];}

import {connect} from './auth/firebase.js';
async function loadQuestionResponse(file){
 try{const {data,db}=await connect();const snap=await data.getDoc(data.doc(db,'siteContent','word-problems'));const v=snap.data()?.value;if(Array.isArray(v)&&v.length&&v.every(q=>typeof q.question==='string'&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length))return {ok:true,json:async()=>v};}catch(e){console.warn('Content fallback',e)}
 return fetch(file);
}

import { progress as progressStorage } from "./auth/progress.js";
"use strict";
const $=id=>document.getElementById(id);
let TOTAL =200;
const KEY="mh_word_problems_v1";

let questions=[];
let current=1;
let answered=false;
let timer=null;
let progress={unlocked:1,stars:{}};

function loadProgress(){
 try{
  const saved=JSON.parse(progressStorage.getItem(KEY));
  if(saved && typeof saved==="object"){
   progress.unlocked=Math.max(
    1,Math.min(TOTAL,Number(saved.unlocked)||1)
   );
   progress.stars=saved.stars && typeof saved.stars==="object"
    ?saved.stars:{};
  }
 }catch(e){}
}

function saveProgress(){
 try{progressStorage.setItem(KEY,JSON.stringify(progress))}
 catch(e){}
}

// Recover the next unlocked question from completed question IDs.
function reconcileUnlocked(){
 let next=1;
 while(next<TOTAL && progress.stars[questions[next-1]?.id]===1)next++;
 progress.unlocked=Math.max(1,Math.min(TOTAL,Math.max(progress.unlocked||1,next)));
}
function completedCount(){
 return Object.values(progress.stars)
  .filter(x=>x===1).length;
}

function cancelNext(){
 if(timer!==null){
  clearTimeout(timer);
  timer=null;
 }
}

function render(){
 cancelNext();
 const q=questions[current-1];
 if(!q)return;

 answered=progress.stars[questions[current-1]?.id]===1;
 reconcileUnlocked();
 if(answered && current<TOTAL && progress.unlocked<=current){
  progress.unlocked=current+1;
 }
 $("level").textContent=gameText("questionNumber").replace("{current}",current).replace("{total}",TOTAL);
 $("bar").style.width=(current/TOTAL*100)+"%";
 $("stats").textContent=
  gameText("progress").replaceAll("{completed}",completedCount()).replace("{total}",TOTAL);

 $("question").textContent=q.question;
 $("choices").replaceChildren();
 $("message").textContent=answered
  ?(current===TOTAL?gameText("complete"):gameText("answered"))
  :"";

 q.options.forEach((option,index)=>{
  const b=document.createElement("button");
  b.className="choice";
  const letter=document.createElement("span");
  letter.className="choice-letter";
  letter.textContent="أبجد"[index] || String(index+1);
  letter.setAttribute("aria-hidden","true");
  b.append(letter,document.createTextNode(String(option)));

  if(answered){
   b.disabled=true;
   if(index===q.answer)b.classList.add("correct");
  }else{
   b.onclick=()=>answer(index);
  }
  $("choices").appendChild(b);
 });

 $("previous").disabled=current===1;
 $("next").disabled=
  current===TOTAL || current>=progress.unlocked;
}

function answer(index){
 if(answered)return;
 const q=questions[current-1];
 const buttons=$("choices").querySelectorAll("button");

 if(index!==q.answer){
  buttons[index].classList.add("wrong");
  $("message").textContent=gameText("wrong");
  return;
 }

 answered=true;
 progress.stars[questions[current-1]?.id]=1;
 progress.unlocked=Math.max(
  progress.unlocked,Math.min(TOTAL,current+1)
 );
 saveProgress();

 buttons.forEach((b,i)=>{
  b.disabled=true;
  b.classList.remove("wrong");
  if(i===q.answer)b.classList.add("correct");
 });

 $("message").textContent=current===TOTAL
  ?gameText("complete")
  :gameText("correct");

 $("stats").textContent=
  gameText("progress").replaceAll("{completed}",completedCount()).replace("{total}",TOTAL);

 $("next").disabled=current===TOTAL;

 // الانتقال التلقائي بعد ثانية من الإجابة الصحيحة
 if(current<TOTAL){
  const from=current;
  cancelNext();
  timer=setTimeout(()=>{
   timer=null;
   if(current===from && answered){
    move(1);
   }
  },1000);
 }
}

function move(direction){
 cancelNext();
 const target=current+direction;
 if(target<1 || target>TOTAL)return;
 if(target>progress.unlocked)return;
 current=target;
 render();
}

function retry(){
 cancelNext();
 if(progress.stars[questions[current-1]?.id]===1){
  $("message").textContent=gameText("already");
  return;
 }
 render();
}

$("previous").onclick=()=>move(-1);
$("next").onclick=()=>move(1);
$("retry").onclick=retry;

async function init(){
 loadProgress();
 current=progress.unlocked;
 $("previous").disabled=true;
 $("next").disabled=true;

 try{
  const response=await loadQuestionResponse("word-problems-questions.json");
  if(!response.ok)throw Error("Failed to load");
  const data=await response.json();

  if(!Array.isArray(data)||!data.length){
   throw Error("Incomplete questions");
  }

  for(const q of data){
   if(typeof q.question!=="string" ||
      !Array.isArray(q.options) ||
      q.options.length!==4 ||
      !Number.isInteger(q.answer) ||
      q.answer<0 || q.answer>3){
    throw Error("Invalid question");
   }
  }

  questions = data.map((q,i)=>({...q,id:q.id||'word-problems-'+(i+1)})); TOTAL=questions.length; current=Math.max(1,Math.min(current,TOTAL)); progress.unlocked=Math.max(1,Math.min(progress.unlocked,TOTAL));
 for(const k of Object.keys(progress.stars)){if(/^\d+$/.test(k)){const id='word-problems-'+k;if(progress.stars[k]===1)progress.stars[id]=1;delete progress.stars[k]}}
 reconcileUnlocked();
 current=progress.unlocked;
 render();
 }catch(e){
  $("question").textContent=gameText("loadError");
  $("message").textContent=gameText("missing");
 }
}
init();

try{const {auth,authApi,data,db}=await connect();authApi.onAuthStateChanged(auth,async u=>{document.getElementById('question-editor')?.remove();if(!u?.emailVerified)return;try{const role=u.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',u.uid))).data()?.role;if(!['admin','editor'].includes(role))return;const bar=document.createElement('div');bar.id='question-editor';bar.dir='rtl';bar.style.cssText='padding:12px;text-align:center';const make=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='margin:4px;padding:10px;background:#ffdfa9;color:#463426;border:1px solid #e6ad65;border-radius:8px';b.onclick=fn;return b};const ref=data.doc(db,'siteContent','word-problems');async function save(next){if(!next.length)throw Error('ينبغي إبقاء سؤال واحد على الأقل');await data.setDoc(ref,{value:next});location.reload()}function edit(add){if(!questions.length){alert('افتح اللعبة أولًا');return}const index=current-1;const old=add?{question:'',options:['','','',''],answer:0}:questions[index];const d=document.createElement('dialog');d.dir='rtl';d.style.cssText='width:min(85vw,480px);border:1px solid #e6ad65;border-radius:12px';const f=document.createElement('form');const q=document.createElement('textarea');q.value=old.question;q.required=true;q.style.width='95%';f.append('السؤال',q);const fields=old.options.map((v,i)=>{const row=document.createElement('label');row.style.display='block';const x=document.createElement('input');x.value=v;x.required=true;row.append('الخيار '+(i+1)+' ',x);f.append(row);return x});const a=document.createElement('select');fields.forEach((_,i)=>a.add(new Option('الخيار '+(i+1),i)));a.value=old.answer;f.append('الإجابة الصحيحة ',a);const b=make('حفظ',()=>{});b.type='submit';f.append(b,make('إلغاء',()=>d.close()));f.onsubmit=async e=>{e.preventDefault();if(!q.value.trim()||fields.some(x=>!x.value.trim()))return;b.disabled=true;try{const next=questions.slice();const item={...old,id:old.id||crypto.randomUUID(),question:q.value.trim(),options:fields.map(x=>x.value.trim()),answer:Number(a.value)};if(add)next.push(item);else next[index]=item;await save(next)}catch(e){alert(e.message);b.disabled=false}};d.append(f);document.body.append(d);d.onclose=()=>d.remove();d.showModal()}const move=async step=>{const i=current-1,j=i+step;if(i<0||j<0||j>=questions.length)return;const next=questions.slice();[next[i],next[j]]=[next[j],next[i]];try{await save(next)}catch(e){alert(e.message)}};bar.append(make('↑ نقل السؤال',()=>move(-1)),make('↓ نقل السؤال',()=>move(1)));bar.append(make('إضافة سؤال',()=>edit(true)),make('تعديل السؤال الحالي',()=>edit(false)),make('حذف السؤال الحالي',async()=>{if(!questions.length||!confirm('حذف السؤال الحالي؟'))return;try{await save(questions.filter((_,i)=>i!==current-1))}catch(e){alert(e.message)}}));document.body.append(bar)}catch(e){console.warn(e)}})}catch(e){console.warn(e)}
</script>
<script type="module" src="auth/navigation.js?v=20261128texts"></script>
</body>
</html>
