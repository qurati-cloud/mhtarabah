<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffb45f"><meta property="og:title" content="محمد وحبيبة | تثبيت التطبيق"><meta property="og:description" content="تطبيق محمد وحبيبة للأطفال"><meta property="og:image" content="https://qurati-cloud.github.io/mhtarabah/app-icon.png"><link rel="manifest" href="./manifest.json"><title>تثبيت التطبيق | محمد وحبيبة</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#fff0cf;color:#63452b;font:16px Tahoma,Arial;padding:24px}main{width:min(100%,420px);background:white;border-radius:28px;padding:28px;text-align:center;box-shadow:0 8px 35px #98611b20}img{width:min(260px,100%);height:auto}h1{font-size:24px}p{line-height:1.9}button,a{display:block;width:100%;padding:15px;margin:12px 0;border-radius:14px;font: bold 17px Tahoma,Arial;text-decoration:none;cursor:pointer}button{background:#ffb45f;border:0;color:#493019}a{background:#fff5e3;color:#63452b}#help{font-size:15px} [hidden]{display:none!important}</style></head><body><main><img src="./mohammad-habiba-logo.png" alt="محمد وحبيبة"><h1>تثبيت التطبيق</h1><p>تعلّم والعب واقرأ مع محمد وحبيبة.</p><button id="install">تثبيت التطبيق</button><p id="help" hidden aria-live="polite"></p><a href="./">فتح التطبيق</a></main><script>
let pending;const btn=document.getElementById('install'),help=document.getElementById('help');const ua=navigator.userAgent;const ios=/iPhone|iPad|iPod/i.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);const embedded=/FBAN|FBAV|Instagram|WhatsApp/i.test(ua);function standalone(){return matchMedia('(display-mode: standalone)').matches||navigator.standalone===true}function instructions(){help.hidden=false;help.textContent=embedded?'افتح قائمة المتصفح واختر فتح في المتصفح الخارجي (Safari أو Chrome)، ثم اضغط تثبيت التطبيق.':ios?'افتح الرابط في Safari، ثم اضغط مشاركة واختر إضافة إلى الشاشة الرئيسية، ثم إضافة.':'افتح قائمة Chrome (⋮) واختر تثبيت التطبيق أو إضافة إلى الشاشة الرئيسية.'}if(standalone()){btn.hidden=true;help.hidden=false;help.textContent='التطبيق مثبت على هاتفك.'}window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();pending=e});btn.onclick=async()=>{if(!pending){instructions();return}const p=pending;pending=null;try{await p.prompt();const choice=await p.userChoice;if(choice.outcome==='accepted'){help.hidden=false;help.textContent='تم قبول طلب التثبيت.'}}catch{instructions()}};window.addEventListener('appinstalled',()=>{btn.hidden=true;help.hidden=false;help.textContent='تم تثبيت التطبيق.'});if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).catch(console.warn);
</script></body></html>
