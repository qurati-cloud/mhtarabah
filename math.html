<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffb45f">
<title>عمليات حسابية — محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Tahoma,Arial,sans-serif;
 background:linear-gradient(180deg,#fff0cf,#fffaf0);
 color:#463426;
 min-height:100vh;
}
header{
 background:linear-gradient(135deg,#ffac53,#ffe1a0);
 text-align:center;
 padding:16px;
 border-radius:0 0 30px 30px;
}
header img{
 display:block;
 margin:auto;
 max-height:125px;
 max-width:80%;
 object-fit:contain;
}
h1{margin:8px;font-size:clamp(26px,5vw,40px)}
main{max-width:850px;margin:25px auto;padding:0 14px}
.panel{
 background:white;
 padding:24px;
 border-radius:25px;
 box-shadow:0 8px 25px #71441515;
}
.top{
 display:flex;
 align-items:center;
 justify-content:space-between;
 gap:12px;
 flex-wrap:wrap;
}
button,.back{
 font:inherit;
 font-weight:bold;
 border:0;
 border-radius:15px;
 padding:13px 16px;
 background:#ffdfa9;
 color:#463426;
 cursor:pointer;
 text-decoration:none;
}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,.back:focus-visible{
 outline:3px solid #2776c6;
 outline-offset:3px;
}
.badge{
 background:#e2f0d8;
 border-radius:12px;
 padding:10px;
}
.progress{
 height:14px;
 background:#eee1d0;
 border-radius:20px;
 overflow:hidden;
 margin:24px 0;
}
#bar{
 width:0%;
 height:100%;
 background:#e5a04d;
 transition:width .25s;
}
#stats{text-align:center;color:#82634b}
#question{
 text-align:center;
 font-size:clamp(25px,4vw,37px);
 line-height:1.9;
 margin:30px 0;
 unicode-bidi:plaintext;
}
.choices{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:14px;
}
.choice{
 min-height:85px;
 font-size:clamp(20px,3vw,28px);
 background:#fff1da;
 border:2px solid #efcb9c;
}
.correct{background:#ccefc9;border-color:#429d49}
.wrong{background:#ffd4d4;border-color:#d64c4c}
#message{
 min-height:55px;
 text-align:center;
 font-size:20px;
 font-weight:bold;
 margin-top:20px;
}
.actions{
 display:flex;
 justify-content:center;
 gap:10px;
 flex-wrap:wrap;
 margin:15px 0;
}
footer{text-align:center;padding:25px;color:#8b715b}
@media(max-width:520px){
 .panel{padding:15px}
 .choices{grid-template-columns:1fr}
 .choice{min-height:65px}
 .top{justify-content:center}
}
</style>
</head>
<body>

<div style="text-align:center;padding:12px 16px"><h1>عمليات حسابية</h1></div>

<main>
<section class="panel">
<div class="top">

<strong class="badge" id="level">السؤال 1 من 200</strong>
</div>

<div class="progress"><div id="bar"></div></div>
<div id="stats"></div>
<h2 id="question">جار تحميل الأسئلة...</h2>
<div class="choices" id="choices"></div>
<div id="message" aria-live="polite"></div>

<div class="actions">
<button id="previous" onclick="move(-1)">السؤال السابق</button>
<button id="next" onclick="move(1)">السؤال التالي</button>
<button onclick="retry()">إعادة المحاولة</button>
</div>
</section>
</main>

<footer>محمد وحبيبة</footer>

<script type="module">
import {connect} from './auth/firebase.js';
async function loadQuestionResponse(file){
 try{const {data,db}=await connect();const snap=await data.getDoc(data.doc(db,'siteContent','math'));const v=snap.data()?.value;if(Array.isArray(v)&&v.length&&v.every(q=>typeof q.question==='string'&&Array.isArray(q.options)&&q.options.length>=2&&Number.isInteger(q.answer)&&q.answer>=0&&q.answer<q.options.length))return {ok:true,json:async()=>v};}catch(e){console.warn('Content fallback',e)}
 return fetch(file);
}

import { progress as progressStorage } from "./auth/progress.js";
"use strict";

const $ = id => document.getElementById(id);
const KEY = "mh_math_v1";
let TOTAL = 200;

let questions = [];
let current = 1;
let progress = {unlocked:1,stars:{}};
let answered = false;
let mathNextTimer = null;
let autoNextTimer = null;
function cancelAutoNext(){
 if(autoNextTimer !== null){
  clearTimeout(autoNextTimer);
  autoNextTimer = null;
 }
}


function loadProgress(){
 try{
  const saved = JSON.parse(progressStorage.getItem(KEY));
  if(saved && typeof saved==="object"){
   progress.unlocked = Math.max(
    1,Math.min(TOTAL,Number(saved.unlocked)||1)
   );
   progress.stars =
    saved.stars && typeof saved.stars==="object"
    ? saved.stars : {};
  }
 }catch(e){}
}

function saveProgress(){
 try{
  progressStorage.setItem(KEY,JSON.stringify(progress));
 }catch(e){}
}

function completedCount(){
 return Object.values(progress.stars)
  .filter(value=>value===1).length;
}

function render(){
 cancelAutoNext();
 const q = questions[current-1];
 if(!q)return;

 answered = progress.stars[questions[current-1]?.id]===1;

 $("level").textContent =
  "السؤال "+current+" من "+TOTAL;

 $("bar").style.width = (current/TOTAL*100)+"%";

 $("stats").textContent =
  "الأسئلة المنجزة: "+completedCount()+
  " من "+TOTAL+" | ⭐ "+completedCount();

 $("question").textContent = q.question;
 $("choices").replaceChildren();
 $("message").textContent = "";

 q.options.forEach((option,index)=>{
  const button = document.createElement("button");
  button.className = "choice";
  button.textContent = "أبجد"[index]+") "+option;

  if(answered){
   button.disabled = true;
   if(index===q.answer)button.classList.add("correct");
  }else{
   button.onclick = ()=>answer(index);
  }

  $("choices").appendChild(button);
 });

 if(answered){
  $("message").textContent = "أجبت عن هذا السؤال";
 }

 $("previous").disabled = current===1;
 $("next").disabled =
  current===TOTAL || current>=progress.unlocked;
}

function answer(index){
 if(answered)return;

 const q = questions[current-1];
 const buttons = $("choices").querySelectorAll("button");

 if(index!==q.answer){
  buttons[index].classList.add("wrong");
  $("message").textContent =
   "الإجابة غير صحيحة، حاول مرة أخرى";
  return;
 }

 answered = true;
 progress.stars[questions[current-1]?.id] = 1;
 progress.unlocked = Math.max(
  progress.unlocked,Math.min(TOTAL,current+1)
 );
 saveProgress();

 buttons.forEach((button,i)=>{
  button.disabled = true;
  button.classList.remove("wrong");
  if(i===q.answer)button.classList.add("correct");
 });

 $("message").textContent =
  current===TOTAL
  ? "🏆 أحسنت! أنهيت جميع الأسئلة!"
  : "⭐ أحسنت! إجابة صحيحة";

 $("stats").textContent =
  "الأسئلة المنجزة: "+completedCount()+
  " من "+TOTAL+" | ⭐ "+completedCount();

 $("next").disabled = current===TOTAL;

 if(current < TOTAL){
  const answeredQuestion = current;
  autoNextTimer = setTimeout(()=>{
   autoNextTimer = null;
   if(current === answeredQuestion && answered){
    move(1);
   }
  },1000);
 }
 if(current < TOTAL){
  const questionNumber = current;
  if(mathNextTimer !== null) clearTimeout(mathNextTimer);
  mathNextTimer = setTimeout(()=>{
   mathNextTimer = null;
   if(current === questionNumber && answered){
    move(1);
   }
  },1000);
 }

}

function move(direction){
 if(mathNextTimer !== null){
  clearTimeout(mathNextTimer);
  mathNextTimer = null;
 }
 cancelAutoNext();
 const target = current+direction;
 if(target<1 || target>TOTAL)return;
 if(target>progress.unlocked)return;
 current = target;
 render();
}

function retry(){
 if(!questions.length)return;
 if(progress.stars[questions[current-1]?.id]===1){
  $("message").textContent = "لقد أجبت عن هذا السؤال بالفعل";
  return;
 }
 render();
}

async function init(){
 loadProgress();
 current = progress.unlocked;

 $("previous").disabled = true;
 $("next").disabled = true;

 try{
  const response = await loadQuestionResponse("math-questions.json");
  if(!response.ok)throw Error("Failed to load");
  const data = await response.json();

  if(!Array.isArray(data)||!data.length){
   throw Error("Incomplete data");
  }

  questions = data.map((q,i)=>({...q,id:q.id||'math-'+(i+1)})); TOTAL=questions.length; current=Math.max(1,Math.min(current,TOTAL)); progress.unlocked=Math.max(1,Math.min(progress.unlocked,TOTAL));
 for(const k of Object.keys(progress.stars)){if(/^\d+$/.test(k)){const id='math-'+k;if(progress.stars[k]===1)progress.stars[id]=1;delete progress.stars[k]}}
  render();
 }catch(e){
  $("question").textContent = "تعذر تحميل الأسئلة";
  $("message").textContent =
   "تأكد من وجود ملف math-questions.json على الموقع";
 }
}

init();
Object.assign(window, {move, retry});

try{const {auth,authApi,data,db}=await connect();authApi.onAuthStateChanged(auth,async u=>{document.getElementById('question-editor')?.remove();if(!u?.emailVerified)return;try{const role=u.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',u.uid))).data()?.role;if(!['admin','editor'].includes(role))return;const bar=document.createElement('div');bar.id='question-editor';bar.dir='rtl';bar.style.cssText='padding:12px;text-align:center';const make=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.style.cssText='margin:4px;padding:10px;background:#ffdfa9;color:#463426;border:1px solid #e6ad65;border-radius:8px';b.onclick=fn;return b};const ref=data.doc(db,'siteContent','math');async function save(next){if(!next.length)throw Error('ينبغي إبقاء سؤال واحد على الأقل');await data.setDoc(ref,{value:next});location.reload()}function edit(add){if(!questions.length){alert('افتح اللعبة أولًا');return}const index=current-1;const old=add?{question:'',options:['','','',''],answer:0}:questions[index];const d=document.createElement('dialog');d.dir='rtl';d.style.cssText='width:min(85vw,480px);border:1px solid #e6ad65;border-radius:12px';const f=document.createElement('form');const q=document.createElement('textarea');q.value=old.question;q.required=true;q.style.width='95%';f.append('السؤال',q);const fields=old.options.map((v,i)=>{const row=document.createElement('label');row.style.display='block';const x=document.createElement('input');x.value=v;x.required=true;row.append('الخيار '+(i+1)+' ',x);f.append(row);return x});const a=document.createElement('select');fields.forEach((_,i)=>a.add(new Option('الخيار '+(i+1),i)));a.value=old.answer;f.append('الإجابة الصحيحة ',a);const b=make('حفظ',()=>{});b.type='submit';f.append(b,make('إلغاء',()=>d.close()));f.onsubmit=async e=>{e.preventDefault();if(!q.value.trim()||fields.some(x=>!x.value.trim()))return;b.disabled=true;try{const next=questions.slice();const item={...old,id:old.id||crypto.randomUUID(),question:q.value.trim(),options:fields.map(x=>x.value.trim()),answer:Number(a.value)};if(add)next.push(item);else next[index]=item;await save(next)}catch(e){alert(e.message);b.disabled=false}};d.append(f);document.body.append(d);d.onclose=()=>d.remove();d.showModal()}const move=async step=>{const i=current-1,j=i+step;if(i<0||j<0||j>=questions.length)return;const next=questions.slice();[next[i],next[j]]=[next[j],next[i]];try{await save(next)}catch(e){alert(e.message)}};bar.append(make('↑ نقل السؤال',()=>move(-1)),make('↓ نقل السؤال',()=>move(1)));bar.append(make('إضافة سؤال',()=>edit(true)),make('تعديل السؤال الحالي',()=>edit(false)),make('حذف السؤال الحالي',async()=>{if(!questions.length||!confirm('حذف السؤال الحالي؟'))return;try{await save(questions.filter((_,i)=>i!==current-1))}catch(e){alert(e.message)}}));document.body.append(bar)}catch(e){console.warn(e)}})}catch(e){console.warn(e)}
</script>
<script type="module" src="auth/navigation.js?v=20261125b"></script>
</body>
</html>
