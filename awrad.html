َمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ خَيْرًا يَرَهُ ﴿٧﴾ وَمَنْ يَعْمَلْ مِثْقَالَ ذَرَّةٍ شَرًّا يَرَهُ ﴿٨﴾", "count": 7, "kind": "quran", "intro": "بِسْمِ اللّهِ الرَّحْمَنِ الرَّحِيمِ"}, {"id": "kafirun", "title": "سورة الكافرون", "text": "قُلْ يَا أَيُّهَا الْكَافِرُونَ ﴿١﴾ لَا أَعْبُدُ مَا تَعْبُدُونَ ﴿٢﴾ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٣﴾ وَلَا أَنَا عَابِدٌ مَا عَبَدْتُمْ ﴿٤﴾ وَلَا أَنْتُمْ عَابِدُونَ مَا أَعْبُدُ ﴿٥﴾ لَكُمْ دِينُكُمْ وَلِيَ دِينِ ﴿٦﴾", "count": 1, "kind": "quran", "intro": "بِسْمِ اللّهِ الرَّحْمَنِ الرَّحِيمِ"}, {"id": "ikhlas", "title": "سورة الإخلاص", "text": "قُلْ هُوَ اللَّـهُ أَحَدٌ ﴿١﴾ اللَّـهُ الصَّمَدُ ﴿٢﴾ لَمْ يَلِدْ وَلَمْ يُولَدْ﴿٣﴾ وَلَمْ يَكُن لَّهُ كُفُوًا أَحَدٌ ﴿٤﴾", "count": 1, "kind": "quran", "intro": "بِسْمِ اللّهِ الرَّحْمَنِ الرَّحِيمِ"}, {"id": "falaq", "title": "سورة الفلق", "text": "قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ ﴿١﴾ مِن شَرِّ مَا خَلَقَ ﴿٢﴾ وَمِن شَرِّ غَاسِقٍ إِذَا وَقَبَ ﴿٣﴾ وَمِن شَرِّ النَّفَّاثَاتِ فِي الْعُقَدِ ﴿٤﴾وَمِن شَرِّ حَاسِدٍ إِذَا حَسَدَ ﴿٥﴾", "count": 1, "kind": "quran", "intro": "بِسْمِ اللّهِ الرَّحْمَنِ الرَّحِيمِ"}, {"id": "nas", "title": "سورة الناس", "text": "قُلْ أَعُوذُ بِرَبِّ النَّاسِ ﴿١﴾ مَلِكِ النَّاسِ ﴿٢﴾ إِلَـهِ النَّاسِ﴿٣﴾ مِن شَرِّ الْوَسْوَاسِ الْخَنَّاسِ ﴿٤﴾ الَّذِي يُوَسْوِسُ فِي صُدُورِ النَّاسِ ﴿٥﴾ مِنَ الْجِنَّةِ وَالنَّاسِ ﴿٦﴾", "count": 1, "kind": "quran", "intro": "بِسْمِ اللّهِ الرَّحْمَنِ الرَّحِيمِ"}, {"id": "bedzikr", "title": "ذكر قبيل النوم", "text": "لا إله إلا الله وحده لا شريك له له الملك وله الحمد وهو على كل شىء قدير، ولا حول ولا قوة إلا بالله، سبحان الله وبحمده، لا إله إلا الله والله أكبر", "count": 1, "kind": "dhikr", "intro": ""}, {"id": "qini", "title": "اللهمّ قني عذابَك", "text": "اللهمّ قني عذابَك يوم تبعث عبادَك", "count": 3, "kind": "dhikr", "intro": ""}]};
DATA.mulk=[{"id":"mulk","title":"سورة الملك","text":"تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ ﴿١﴾ الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا وَهُوَ الْعَزِيزُ الْغَفُورُ ﴿٢﴾ الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا مَا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِنْ تَفَاوُتٍ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِنْ فُطُورٍ ﴿٣﴾ ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنْقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ ﴿٤﴾ وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِلشَّيَاطِينِ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ ﴿٥﴾ وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ وَبِئْسَ الْمَصِيرُ ﴿٦﴾ إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ ﴿٧﴾ تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ ﴿٨﴾ قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِنْ شَيْءٍ إِنْ أَنْتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ ﴿٩﴾ وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ ﴿١٠﴾ فَاعْتَرَفُوا بِذَنْبِهِمْ فَسُحْقًا لِأَصْحَابِ السَّعِيرِ ﴿١١﴾ إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُمْ بِالْغَيْبِ لَهُمْ مَغْفِرَةٌ وَأَجْرٌ كَبِيرٌ ﴿١٢﴾ وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ ﴿١٣﴾ أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ ﴿١٤﴾ هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِنْ رِزْقِهِ وَإِلَيْهِ النُّشُورُ ﴿١٥﴾ أَأَمِنْتُمْ مَنْ فِي السَّمَاءِ أَنْ يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ ﴿١٦﴾ أَمْ أَمِنْتُمْ مَنْ فِي السَّمَاءِ أَنْ يُرْسِلَ عَلَيْكُمْ حَاصِبًا فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ ﴿١٧﴾ وَلَقَدْ كَذَّبَ الَّذِينَ مِنْ قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ ﴿١٨﴾ أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَٰنُ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ ﴿١٩﴾ أَمَّنْ هَٰذَا الَّذِي هُوَ جُنْدٌ لَكُمْ يَنْصُرُكُمْ مِنْ دُونِ الرَّحْمَٰنِ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ ﴿٢٠﴾ أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ بَلْ لَجُّوا فِي عُتُوٍّ وَنُفُورٍ ﴿٢١﴾ أَفَمَنْ يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّنْ يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُسْتَقِيمٍ ﴿٢٢﴾ قُلْ هُوَ الَّذِي أَنْشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ قَلِيلًا مَا تَشْكُرُونَ ﴿٢٣﴾ قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ ﴿٢٤﴾ وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِنْ كُنْتُمْ صَادِقِينَ ﴿٢٥﴾ قُلْ إِنَّمَا الْعِلْمُ عِنْدَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُبِينٌ ﴿٢٦﴾ فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَٰذَا الَّذِي كُنْتُمْ بِهِ تَدَّعُونَ ﴿٢٧﴾ قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَنْ مَعِيَ أَوْ رَحِمَنَا فَمَنْ يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ ﴿٢٨﴾ قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُبِينٍ ﴿٢٩﴾ قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَنْ يَأْتِيكُمْ بِمَاءٍ مَعِينٍ ﴿٣٠﴾","count":1,"kind":"quran","intro":"أعوذ بالله من الشيطان الرجيم\nبِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ"}];

function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(item){const current=Math.min(item.count,getNum(item.id));return `<article class="card ${current===item.count?'done':''}"><div class="top"><h3>${escapeHTML(item.title)}</h3><span class="pill">${item.count===1?'مرة واحدة':item.count+' مرات'}</span></div>${item.intro?`<p class="intro">${escapeHTML(item.intro)}</p>`:''}<p class="verse">${escapeHTML(item.text)}</p><div class="actions"><button class="action" data-id="${escapeHTML(item.id)}" data-act="add" ${current>=item.count?'disabled':''}>${current>=item.count?'✓ اكتمل':'قرأتُ مرة'}</button><span class="count">${current} / ${item.count}</span><button class="reset" data-id="${escapeHTML(item.id)}" data-act="reset">إعادة</button>${current>=item.count?'<span class="success">✓ تم الورد</span>':''}</div></article>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab||tab.startsWith(b.dataset.tab+'_')));if(tab==='counter'){document.getElementById('mainContent').innerHTML=`<div class="counterbox"><h2>عداد عام</h2><label>العدد المطلوب <span class="target-step"><input id="target" type="text" inputmode="numeric" pattern="[0-9٠-٩۰-۹]+" maxlength="6" value="${target}" aria-label="العدد المطلوب"><span><button type="button" id="targetUp" aria-label="زيادة العدد">▲</button><button type="button" id="targetDown" aria-label="إنقاص العدد">▼</button></span></span></label><output id="total">${counter}</output><button id="tick">+١</button><button class="reset" id="zero">إعادة العداد</button><p id="counterStatus" role="status"></p></div>`;const out=document.getElementById('total'),status=document.getElementById('counterStatus');const field=document.getElementById('target');const normalize=v=>v.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776));const apply=n=>{const next=Math.max(1,Math.min(999999,n));if(next!==target){target=next;counter=0;out.textContent=0;status.textContent=''}};field.oninput=()=>{field.value=field.value.replace(/[^0-9٠-٩۰-۹]/g,'');if(Number(normalize(field.value))>0)apply(Number(normalize(field.value)))};field.onblur=()=>{if(!Number(normalize(field.value)))field.value=target};const step=n=>{apply(target+n);field.value=target};document.getElementById('targetUp').onclick=()=>step(1);document.getElementById('targetDown').onclick=()=>step(-1);field.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ArrowDown'){e.preventDefault();step(e.key==='ArrowUp'?1:-1)}};document.getElementById('tick').onclick=()=>{if(counter>=target)return;out.textContent=++counter;if(counter===target){status.textContent='✓ اكتمل العدد';navigator.vibrate?.([200,100,200]);}};document.getElementById('zero').onclick=()=>{counter=0;out.textContent=0;status.textContent=''};return}if(tab==='other'){document.getElementById('mainContent').innerHTML='<h2>أوراد أخرى</h2><div class="empty"><h3>دعاء السوق</h3><p class="hint">بانتظار النص والتسجيل الصوتي.</p></div><div class="empty" style="margin-top:12px"><h3>دعاء الذهاب إلى المسجد</h3><p class="hint">بانتظار النص والتسجيل الصوتي.</p></div>';return}

function getNum(id){const d=window.selectedDate||localDate();return Math.max(0,Number(state[d]?.[tab]?.[id]||0))}
function setNum(id,value){const d=window.selectedDate||localDate();if(!state[d])state[d]={};if(!state[d][tab])state[d][tab]={};state[d][tab][id]=value;try{progressStorage.setItem(storeKey,JSON.stringify(state))}catch(e){alert('تعذر حفظ الإنجازات')};render()}

async function edit(id){const section=tab;const items=DATA[section];const old=items.find(i=>i.id===id);const dialog=document.createElement('dialog');dialog.style.cssText='width:min(90vw,520px);border:1px solid #efb36d;border-radius:16px;direction:rtl';const form=document.createElement('form');const fields={};for(const [key,label] of [['title','العنوان'],['intro','المقدمة'],['text','نص الورد'],['count','عدد التكرار'],['kind','النوع']]){const l=document.createElement('label');l.textContent=label;const el=document.createElement(key==='text'||key==='intro'?'textarea':key==='kind'?'select':'input');if(key==='kind'){el.add(new Option('ذكر أو دعاء','dhikr'));el.add(new Option('قرءان','quran'))}el.value=old?.[key]??(key==='count'?1:key==='kind'?'dhikr':'');el.style.cssText='display:block;width:100%;box-sizing:border-box;margin:6px 0 12px;padding:8px';if(key==='text')el.rows=8;if(key==='count')el.inputMode='numeric';fields[key]=el;l.append(el);form.append(l)}const save=button('حفظ',()=>{});save.type='submit';const cancel=button('إلغاء',()=>dialog.close());cancel.type='button';form.append(save,cancel);dialog.append(form);document.body.append(dialog);dialog.onclose=()=>dialog.remove();form.onsubmit=async e=>{e.preventDefault();const v=Object.fromEntries(Object.entries(fields).map(([k,x])=>[k,x.value]));v.count=Number(v.count.replace(/[٠-٩]/g,c=>String(c.charCodeAt(0)-1632)).replace(/[۰-۹]/g,c=>String(c.charCodeAt(0)-1776)));if(!v.title.trim()||!v.text.trim()||!Number.isSafeInteger(v.count)||v.count<1){alert('أدخل العنوان والنص وعددًا صحيحًا');return}v.id=old?.id||crypto.randomUUID();save.disabled=true;try{await persist(section,a=>old?a.map(i=>i.id===id?v:i):[...a,v]);dialog.close()}catch(e){alert(e.message);save.disabled=false}};dialog.showModal()}
async function persist(section,change){await data.runTransaction(db,async tx=>{const snap=await tx.get(ref);const existing=snap.data()?.value||{};const base=valid(existing[section])?existing[section]:DATA[section];const next=change(base);tx.set(ref,{value:{...DATA,...existing,[section]:next}})});const snap=await data.getDoc(ref);for(const [k,v] of Object.entries(snap.data().value))if(valid(v))DATA[k]=v;render()}
