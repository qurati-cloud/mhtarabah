const TITLES={morning:'أوراد الصباح',evening:'أوراد المساء',bed:'أوراد قبيل النوم',other:'أوراد أخرى'};
const storeKey='mh-awrad-v1';let state={};try{state=JSON.parse(progressStorage.getItem(storeKey)||'{}')||{}}catch(e){state={}};
const dateEl=document.getElementById('date');const localDate=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};dateEl.value=localDate();let tab='morning';
function escapeHTML(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(item){const current=Math.min(item.count,getNum(item.id));return `<article class="card ${current===item.count?'done':''}"><div class="top"><h3>${escapeHTML(item.title)}</h3><span class="pill">${item.count===1?'مرة واحدة':item.count+' مرات'}</span></div>${item.intro?`<p class="intro">${escapeHTML(item.intro)}</p>`:''}<p class="verse">${escapeHTML(item.text)}</p><div class="actions"><button class="action" data-id="${escapeHTML(item.id)}" data-act="add" ${current>=item.count?'disabled':''}>${current>=item.count?'✓ اكتمل':'قرأتُ مرة'}</button><span class="count">${current} / ${item.count}</span><button class="reset" data-id="${escapeHTML(item.id)}" data-act="reset">إعادة</button>${current>=item.count?'<span class="success">✓ تم الورد</span>':''}</div></article>`}
function render(){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='other'){document.getElementById('mainContent').innerHTML='<h2>أوراد أخرى</h2><div class="empty"><h3>دعاء السوق</h3><p class="hint">بانتظار النص والتسجيل الصوتي.</p></div><div class="empty" style="margin-top:12px"><h3>دعاء الذهاب إلى المسجد</h3><p class="hint">بانتظار النص والتسجيل الصوتي.</p></div>';return}
// Recreate toolbar after switching back from the "other" tab.
document.getElementById('mainContent').innerHTML='<div class="toolbar"><label>تاريخ الإنجاز <input type="date" id="date"></label><strong id="summary"></strong></div><div class="progress" role="progressbar" aria-label="تقدم الأوراد"><div id="fill" class="fill"></div></div><div id="cards"></div>';
const input=document.getElementById('date');input.value=window.selectedDate||localDate();input.addEventListener('change',()=>{window.selectedDate=input.value;render()});const items=DATA[tab];const done=items.filter(i=>getNum(i.id)>=i.count).length;document.getElementById('summary').textContent=`${done} من ${items.length} أوراد مكتملة`;document.getElementById('fill').style.width=(done/items.length*100)+'%';document.getElementById('cards').innerHTML='<h2 class="section">القرءان الكريم</h2>'+items.filter(i=>i.kind==='quran').map(card).join('')+'<h2 class="section">الأذكار والأدعية</h2>'+items.filter(i=>i.kind!=='quran').map(card).join('');}
// Resolve the date input from the current rendered view (it is replaced on each render).
function getNum(id){const d=window.selectedDate||localDate();return Math.max(0,Number(state[d]?.[tab]?.[id]||0))}
function setNum(id,value){const d=window.selectedDate||localDate();if(!state[d])state[d]={};if(!state[d][tab])state[d][tab]={};state[d][tab][id]=value;try{progressStorage.setItem(storeKey,JSON.stringify(state))}catch(e){alert('تعذر حفظ الإنجازات')};render()}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{tab=b.dataset.tab;render()}));document.addEventListener('click',e=>{const btn=e.target.closest('button[data-act]');if(!btn)return;const it=DATA[tab]?.find(i=>i.id===btn.dataset.id);if(!it)return;setNum(it.id,btn.dataset.act==='reset'?0:Math.min(it.count,getNum(it.id)+1))});render();
