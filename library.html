<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:20px auto;padding:16px}section{background:white;border-radius:20px;padding:20px;margin:12px 0}button,input,select{font:inherit;padding:12px;border:1px solid #e6ad65;border-radius:12px}button{background:#ffdfa9;cursor:pointer}input{width:100%;margin:10px 0}#books{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}article{border:1px solid #e6ad65;border-radius:16px;padding:16px}article img{width:100%;height:180px;object-fit:contain}a{color:inherit}</style><main><h1>المكتبة</h1><a id="manage" href="library-admin.html" hidden>إدارة المكتبة</a><section><button id="all">جميع الكتب</button> <button id="mine">مكتبتي</button><input id="search" placeholder="ابحث عن كتاب أو سلسلة" aria-label="البحث"><p id="status" role="status">جار تحميل المكتبة…</p><div id="books"></div></section></main><script type="module" src="auth/navigation.js?v=20261126a"></script><script type="module">
import {connect} from './auth/firebase.js';
import {progress,updateProgress} from './auth/progress.js';
const $=id=>document.getElementById(id), key='mh-library-v1';let books=[],personal=false;
function saved(){try{return JSON.parse(progress.getItem(key)||'{}')}catch{return {}}}
function render(){const q=$('search').value.trim().toLowerCase(),s=saved();$('books').replaceChildren();for(const b of books.filter(b=>(!personal||s[b.id]?.saved)&&[b.title,b.series,b.description].join(' ').toLowerCase().includes(q))){const card=document.createElement('article'),title=document.createElement('h3'),desc=document.createElement('p'),btn=document.createElement('button');title.textContent=b.title;desc.textContent=[b.series,b.description].filter(Boolean).join(' · ');btn.textContent=s[b.id]?.saved?'إزالة من مكتبتي':'أضف إلى مكتبتي';btn.onclick=async()=>{try{await updateProgress(key,old=>({...old,[b.id]:{...old?.[b.id],saved:!old?.[b.id]?.saved}}));render()}catch{$('status').textContent='تعذر حفظ الكتاب'}};card.append(title,desc,btn);$('books').append(card)}$('status').textContent=$('books').children.length?'':'لا توجد كتب متاحة';}
$('all').onclick=()=>{personal=false;render()};$('mine').onclick=()=>{personal=true;render()};$('search').oninput=render;
try{const {data,db,auth,authApi}=await connect();let turn=0;authApi.onAuthStateChanged(auth,async user=>{const t=++turn;$("manage").hidden=true;if(!user?.emailVerified)return;try{const role=user.email==="quraaty@gmail.com"?"admin":(await data.getDoc(data.doc(db,"roles",user.uid))).data()?.role;if(t===turn&&role==="admin")$("manage").hidden=false}catch{}});data.onSnapshot(data.query(data.collection(db,'libraryBooks'),data.where('published','==',true)),snap=>{books=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0));render()},()=>{$('status').textContent='المكتبة غير متاحة حاليًا'});}catch{$('status').textContent='تعذر الاتصال بالمكتبة'}
</script></html>
