<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:20px auto;padding:16px}section{background:white;border-radius:20px;padding:20px;margin:12px 0}button,input,select{font:inherit;padding:12px;border:1px solid #e6ad65;border-radius:12px}button{background:#ffdfa9;cursor:pointer}input{width:100%;margin:10px 0}#books{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}article{border:1px solid #e6ad65;border-radius:16px;padding:16px}article img{width:100%;height:180px;object-fit:contain}a{color:inherit} #pages{overflow:auto;max-width:100%;direction:rtl}#pages .docx-wrapper{padding:8px;background:#eee}#pages .docx-wrapper>section{margin:0 auto 12px;border-radius:0}  #reader{min-width:0;overflow:hidden}#pages{width:100%;overflow-x:hidden}#pages .docx-wrapper{display:block!important;width:100%!important;min-width:0!important;padding:0!important;background:white!important}#pages .docx-wrapper>section{box-sizing:border-box!important;width:100%!important;max-width:100%!important;min-width:0!important;padding:12px 6px!important;overflow:visible!important}#pages .docx-wrapper article{width:100%!important;min-width:0!important;max-width:100%!important;border:0;padding:0}#pages .docx-wrapper p{max-width:100%!important;white-space:normal!important;overflow-wrap:anywhere; margin-inline:0!important;text-indent:0!important}#pages .docx-wrapper img,#pages .docx-wrapper svg{max-width:100%!important;height:auto}#pages .docx-wrapper table{max-width:100%!important;width:100%!important;table-layout:fixed}#pages .docx-wrapper td{overflow-wrap:anywhere;min-width:0!important}  #pages .docx-wrapper{background:#f0e6d6!important}#pages .docx-wrapper>section{margin:0 0 24px!important;padding:24px 8px 30px!important;border-bottom:2px solid #d6b780;box-shadow:0 2px 5px #0001}#pages .docx-wrapper>section:last-child{margin-bottom:0!important}  #orderTools{margin:12px 0}#orderTools button{margin:4px}#books article[draggable=true]{cursor:grab}#books article.dragover{outline:3px solid #c77d29} .order-controls{display:flex;gap:5px;align-items:center;margin-bottom:8px}.order-controls button{padding:8px;min-width:36px}</style><main><h1>المكتبة</h1><a id="manage" href="library-admin.html" hidden>إدارة المكتبة</a><section><button id="all">جميع الكتب</button> <button id="mine">مكتبتي</button> <button id="reorder" hidden>ترتيب الكتب</button><div id="orderTools" hidden><p>اسحب البطاقات أو استخدم الأسهم لتغيير ترتيبها.</p><button id="saveOrder">حفظ الترتيب</button><button id="cancelOrder">إلغاء</button><p id="orderStatus" role="status"></p></div><input id="search" placeholder="ابحث عن كتاب أو سلسلة" aria-label="البحث"><p id="status" role="status">جار تحميل المكتبة…</p><div id="books"></div></section><section id="reader" hidden><button id="closeReader">إغلاق الكتاب</button><h2 id="readerTitle"></h2><div id="pages"></div></section></main><script type="module" src="auth/navigation.js?v=20261126a"></script><script type="module">
import {readAsset} from './library-assets.js';
import {connect} from './auth/firebase.js';
import {progress,updateProgress} from './auth/progress.js';
const $=id=>document.getElementById(id), key='mh-library-v1';let books=[],personal=false,api,readerUrl,reading=0;
let canOrder=false,editing=false,customOrder=[],draft=[],dragId='',saving=false;
function ordered(ids){const rank=new Map(ids.map((id,i)=>[id,i]));return [...books].sort((a,b)=>(rank.get(a.id)??Infinity)-(rank.get(b.id)??Infinity)||(a.order||0)-(b.order||0)||a.id.localeCompare(b.id))}
function finishOrder(){editing=false;draft=[];dragId='';$('orderTools').hidden=true;$('reorder').hidden=!canOrder;$('search').disabled=false;$('all').disabled=false;$('mine').disabled=false;render()}
function move(id,target){if(!editing||saving)return;const i=draft.indexOf(id);if(i<0||target<0||target>=draft.length)return;draft.splice(i,1);draft.splice(target,0,id);render()}
$('reorder').onclick=()=>{if(!canOrder)return;editing=true;personal=false;$('search').value='';$('search').disabled=true;$('all').disabled=true;$('mine').disabled=true;draft=ordered(customOrder).map(b=>b.id);$('orderTools').hidden=false;$('reorder').hidden=true;$('orderStatus').textContent='';render()};
$('cancelOrder').onclick=()=>{if(!saving)finishOrder()};
$('saveOrder').onclick=async()=>{if(!canOrder||!editing||saving)return;saving=true;$('saveOrder').disabled=true;$('cancelOrder').disabled=true;try{const ids=ordered(draft).map(b=>b.id);await api.data.setDoc(api.data.doc(api.db,'siteContent','library-order-v1'),{ids});customOrder=ids;finishOrder();$('status').textContent='تم حفظ ترتيب الكتب'}catch(e){$('orderStatus').textContent='تعذر حفظ الترتيب: '+e.message}finally{saving=false;$('saveOrder').disabled=false;$('cancelOrder').disabled=false}};
function saved(){try{return JSON.parse(progress.getItem(key)||'{}')}catch{return {}}}
function render(){const q=$('search').value.trim().toLowerCase(),s=saved();$('books').replaceChildren();for(const b of ordered(editing?draft:customOrder).filter(b=>(!personal||s[b.id]?.saved)&&[b.title,b.series,b.description].join(' ').toLowerCase().includes(q))){const card=document.createElement('article'),title=document.createElement('h3'),desc=document.createElement('p'),btn=document.createElement('button');title.textContent=b.title;desc.textContent=[b.series,b.description].filter(Boolean).join(' · ');btn.textContent=s[b.id]?.saved?'إزالة من مكتبتي':'أضف إلى مكتبتي';btn.onclick=async()=>{try{await updateProgress(key,old=>({...old,[b.id]:{...old?.[b.id],saved:!old?.[b.id]?.saved}}));render()}catch{$('status').textContent='تعذر حفظ الكتاب'}};card.append(title,desc,btn);if(editing){const controls=document.createElement("div");controls.className="order-controls";const i=draft.indexOf(b.id);for(const [label,delta,aria] of [["→",-1,"تقديم الكتاب"],["←",1,"تأخير الكتاب"]]){const arrow=document.createElement("button");arrow.textContent=label;arrow.setAttribute("aria-label",aria+" "+b.title);arrow.disabled=i<0||i+delta<0||i+delta>=draft.length;arrow.onclick=()=>move(b.id,i+delta);controls.append(arrow)}controls.append(document.createTextNode(String(i+1)));card.prepend(controls);btn.disabled=true;card.draggable=true;card.ondragstart=e=>{dragId=b.id;e.dataTransfer.setData("text/plain",b.id);e.dataTransfer.effectAllowed="move"};card.ondragover=e=>{e.preventDefault();card.classList.add("dragover")};card.ondragleave=()=>card.classList.remove("dragover");card.ondrop=e=>{e.preventDefault();card.classList.remove("dragover");if(dragId&&dragId!==b.id)move(dragId,draft.indexOf(b.id));dragId=""};card.ondragend=()=>{dragId="";document.querySelectorAll(".dragover").forEach(x=>x.classList.remove("dragover"))}}if(b.coverAsset&&api){readAsset(api.data,api.db,b.id,b.coverAsset).then(blob=>{if(!card.isConnected)return;const img=document.createElement('img'),url=URL.createObjectURL(blob);img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url;img.alt='غلاف '+b.title;card.prepend(img)}).catch(()=>{})}if(b.fileAsset){const open=document.createElement('button');open.textContent='اقرأ الكتاب';open.disabled=editing;open.onclick=()=>openBook(b);card.append(open)}$('books').append(card)}$('status').textContent=$('books').children.length?'':'لا توجد كتب متاحة';}
$('all').onclick=()=>{personal=false;render()};$('mine').onclick=()=>{personal=true;render()};$('search').oninput=render;
let wordLoader;
function loadWord(){return wordLoader ||= (async()=>{const load=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(Error('تعذر تحميل قارئ Word'));document.head.append(script)});await load('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');await load('https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js');return window.docx;})().catch(e=>{wordLoader=null;throw e})}
async function openBook(b){const turn=++reading;$('reader').hidden=false;$('readerTitle').textContent=b.title;$('pages').textContent='جار تحميل الكتاب…';if(readerUrl)URL.revokeObjectURL(readerUrl);try{const blob=await readAsset(api.data,api.db,b.id,b.fileAsset);if(turn!==reading)return;readerUrl=URL.createObjectURL(blob);$('pages').replaceChildren();if(b.fileAsset.type==='application/pdf'){const frame=document.createElement('iframe');frame.title=b.title;frame.src=readerUrl;frame.style.cssText='width:100%;height:75vh;border:0';$('pages').append(frame)}else if(/\.docx$/i.test(b.fileAsset.name)||b.fileAsset.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){const viewer=await loadWord();if(turn!==reading)return;const host=document.createElement('div');$('pages').append(host);await viewer.renderAsync(await blob.arrayBuffer(),host,host,{ignoreWidth:true,ignoreHeight:true,breakPages:true,ignoreLastRenderedPageBreak:false});if(turn!==reading)return;}else $('pages').textContent='ملف DOC قديم. ينبغي تحويله إلى DOCX أو PDF لقراءته داخل التطبيق.';$('reader').scrollIntoView()}catch(e){if(turn===reading)$('pages').textContent='تعذر فتح الكتاب: '+e.message}}
$('closeReader').onclick=()=>{reading++;$('reader').hidden=true;$('pages').replaceChildren();if(readerUrl)URL.revokeObjectURL(readerUrl);readerUrl=null};
try{api=await connect();const {data,db,auth,authApi}=api;let turn=0;authApi.onAuthStateChanged(auth,async user=>{const t=++turn;$("manage").hidden=true;canOrder=false;finishOrder();if(!user?.emailVerified)return;try{const role=user.email==="quraaty@gmail.com"?"admin":(await data.getDoc(data.doc(db,"roles",user.uid))).data()?.role;if(t===turn){$("manage").hidden=role!=="admin";canOrder=role==="admin"||role==="editor";$("reorder").hidden=!canOrder}}catch{}});data.onSnapshot(data.doc(db,'siteContent','library-order-v1'),snap=>{const ids=snap.data()?.ids;customOrder=Array.isArray(ids)?ids.filter(id=>typeof id==='string'):[];if(!editing)render()},()=>{});data.onSnapshot(data.query(data.collection(db,'libraryBooks'),data.where('published','==',true)),snap=>{books=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0));if(editing){const available=new Set(books.map(b=>b.id));draft=draft.filter(id=>available.has(id));for(const b of books)if(!draft.includes(b.id))draft.push(b.id)}render()},()=>{$('status').textContent='المكتبة غير متاحة حاليًا'});}catch{$('status').textContent='تعذر الاتصال بالمكتبة'}
</script></html>
