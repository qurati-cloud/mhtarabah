<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المكتبة</title><style>*{box-sizing:border-box}body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:900px;margin:20px auto;padding:16px}section{background:white;border-radius:20px;padding:20px;margin:12px 0}button,input,select{font:inherit;padding:12px;border:1px solid #e6ad65;border-radius:12px}button{background:#ffdfa9;cursor:pointer}input{width:100%;margin:10px 0}#books{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}article{border:1px solid #e6ad65;border-radius:16px;padding:16px}article img{width:100%;height:180px;object-fit:contain}a{color:inherit} #pages{overflow:auto;max-width:100%;direction:rtl}#pages .docx-wrapper{padding:8px;background:#eee}#pages .docx-wrapper>section{margin:0 auto 12px;border-radius:0} </style><main><h1>المكتبة</h1><a id="manage" href="library-admin.html" hidden>إدارة المكتبة</a><section><button id="all">جميع الكتب</button> <button id="mine">مكتبتي</button><input id="search" placeholder="ابحث عن كتاب أو سلسلة" aria-label="البحث"><p id="status" role="status">جار تحميل المكتبة…</p><div id="books"></div></section><section id="reader" hidden><button id="closeReader">إغلاق الكتاب</button> <a id="downloadBook" download>فتح الملف الأصلي</a><h2 id="readerTitle"></h2><div id="pages"></div></section></main><script type="module" src="auth/navigation.js?v=20261126a"></script><script type="module">
import {readAsset} from './library-assets.js';
import {connect} from './auth/firebase.js';
import {progress,updateProgress} from './auth/progress.js';
const $=id=>document.getElementById(id), key='mh-library-v1';let books=[],personal=false,api,readerUrl,reading=0;
function saved(){try{return JSON.parse(progress.getItem(key)||'{}')}catch{return {}}}
function render(){const q=$('search').value.trim().toLowerCase(),s=saved();$('books').replaceChildren();for(const b of books.filter(b=>(!personal||s[b.id]?.saved)&&[b.title,b.series,b.description].join(' ').toLowerCase().includes(q))){const card=document.createElement('article'),title=document.createElement('h3'),desc=document.createElement('p'),btn=document.createElement('button');title.textContent=b.title;desc.textContent=[b.series,b.description].filter(Boolean).join(' · ');btn.textContent=s[b.id]?.saved?'إزالة من مكتبتي':'أضف إلى مكتبتي';btn.onclick=async()=>{try{await updateProgress(key,old=>({...old,[b.id]:{...old?.[b.id],saved:!old?.[b.id]?.saved}}));render()}catch{$('status').textContent='تعذر حفظ الكتاب'}};card.append(title,desc,btn);if(b.coverAsset&&api){readAsset(api.data,api.db,b.id,b.coverAsset).then(blob=>{if(!card.isConnected)return;const img=document.createElement('img'),url=URL.createObjectURL(blob);img.onload=img.onerror=()=>URL.revokeObjectURL(url);img.src=url;img.alt='غلاف '+b.title;card.prepend(img)}).catch(()=>{})}if(b.fileAsset){const open=document.createElement('button');open.textContent='اقرأ الكتاب';open.onclick=()=>openBook(b);card.append(open)}$('books').append(card)}$('status').textContent=$('books').children.length?'':'لا توجد كتب متاحة';}
$('all').onclick=()=>{personal=false;render()};$('mine').onclick=()=>{personal=true;render()};$('search').oninput=render;
let wordLoader;
function loadWord(){return wordLoader ||= (async()=>{const load=src=>new Promise((resolve,reject)=>{const script=document.createElement('script');script.src=src;script.onload=resolve;script.onerror=()=>reject(Error('تعذر تحميل قارئ Word'));document.head.append(script)});await load('https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js');await load('https://cdn.jsdelivr.net/npm/docx-preview@0.3.6/dist/docx-preview.min.js');return window.docx;})().catch(e=>{wordLoader=null;throw e})}
async function openBook(b){const turn=++reading;$('reader').hidden=false;$('readerTitle').textContent=b.title;$('pages').textContent='جار تحميل الكتاب…';$('downloadBook').removeAttribute('href');if(readerUrl)URL.revokeObjectURL(readerUrl);try{const blob=await readAsset(api.data,api.db,b.id,b.fileAsset);if(turn!==reading)return;readerUrl=URL.createObjectURL(blob);$('downloadBook').href=readerUrl;$('downloadBook').download=b.fileAsset.name;$('pages').replaceChildren();if(b.fileAsset.type==='application/pdf'){const frame=document.createElement('iframe');frame.title=b.title;frame.src=readerUrl;frame.style.cssText='width:100%;height:75vh;border:0';$('pages').append(frame)}else if(/\.docx$/i.test(b.fileAsset.name)||b.fileAsset.type==='application/vnd.openxmlformats-officedocument.wordprocessingml.document'){const viewer=await loadWord();if(turn!==reading)return;const host=document.createElement('div');$('pages').append(host);await viewer.renderAsync(await blob.arrayBuffer(),host,host,{ignoreWidth:true,ignoreHeight:true,breakPages:true});if(turn!==reading)return;}else $('pages').textContent='ملف DOC قديم. ينبغي تحويله إلى DOCX أو PDF لقراءته داخل التطبيق.';$('reader').scrollIntoView()}catch(e){if(turn===reading)$('pages').textContent='تعذر فتح الكتاب: '+e.message}}
$('closeReader').onclick=()=>{reading++;$('reader').hidden=true;$('pages').replaceChildren();if(readerUrl)URL.revokeObjectURL(readerUrl);readerUrl=null};
try{api=await connect();const {data,db,auth,authApi}=api;let turn=0;authApi.onAuthStateChanged(auth,async user=>{const t=++turn;$("manage").hidden=true;if(!user?.emailVerified)return;try{const role=user.email==="quraaty@gmail.com"?"admin":(await data.getDoc(data.doc(db,"roles",user.uid))).data()?.role;if(t===turn&&role==="admin")$("manage").hidden=false}catch{}});data.onSnapshot(data.query(data.collection(db,'libraryBooks'),data.where('published','==',true)),snap=>{books=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>(a.order||0)-(b.order||0));render()},()=>{$('status').textContent='المكتبة غير متاحة حاليًا'});}catch{$('status').textContent='تعذر الاتصال بالمكتبة'}
</script></html>
