<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الطيران | محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#eaf7ff;font-family:Tahoma,Arial,sans-serif;color:#17354b}
header{background:linear-gradient(120deg,#ffad45,#ffdb85);padding:14px;text-align:center}
h1{margin:0;font-size:25px}
main{max-width:950px;margin:auto;padding:12px}
.toolbar,.controls{display:flex;gap:9px;flex-wrap:wrap;justify-content:center;align-items:center;margin:12px 0}
button,select{border:0;border-radius:13px;padding:12px 17px;background:#ffab42;color:#35200a;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
a{color:#17354b}
#screen{display:block;width:100%;background:#8ed9ff;border:4px solid #fff;border-radius:20px;touch-action:none;box-shadow:0 5px 18px #abc8d8}
#message{text-align:center;min-height:38px;font-size:19px;font-weight:bold}
.control{min-width:100px;min-height:64px;background:#fff}
.info{display:flex;justify-content:space-around;gap:8px;flex-wrap:wrap;margin:12px 0;font-weight:bold}
small{display:block;text-align:center;color:#496678}
</style>
</head>
<body>
<header><h1>✈️ الطيران</h1><div>مغامرات محمد وحبيبة</div></header>
<main>
<div class="toolbar">
<a href="index.html">↩ العودة إلى الألعاب</a>
<button id="prev">المرحلة السابقة</button>
<select id="levels" aria-label="اختيار المرحلة"></select>
<button id="next">المرحلة التالية</button>
</div>
<div class="info">
<span id="levelLabel"></span>
<span id="stars"></span>
<span id="distance"></span>
<span id="best"></span>
</div>
<canvas id="screen" width="900" height="500"></canvas>
<div id="message">اضغط ابدأ لتبدأ المغامرة!</div>
<div class="controls">
<button id="up" class="control">⬆️ ارتفاع</button>
<button id="down" class="control">⬇️ انخفاض</button>
<button id="start">▶ ابدأ</button>
<button id="retry">↻ إعادة</button>
<button id="pause">⏸ إيقاف</button>
</div>
<small>الكمبيوتر: الأسهم للأعلى والأسفل، أو W و S. الهاتف: اضغط باستمرار على أزرار الارتفاع والانخفاض.</small>
</main>
<script>
"use strict";
const canvas=document.getElementById("screen");
const ctx=canvas.getContext("2d");
const $=id=>document.getElementById(id);
const W=900,H=500;
const KEY="mh_flight_progress_v1";
let unlocked=1;
try{unlocked=Math.min(100,Math.max(1,Number(localStorage.getItem(KEY))||1))}catch(e){}
let level=1,playing=false,paused=false,finished=false;
let frame=0,last=0,world=0,score=0,obstacles=[],particles=[];
let plane={x:145,y:240,vy:0,r:19};
let input={up:false,down:false};
let seed=1,goal=2200,speed=3,spawn=0;

function random(){
 seed=(Math.imul(seed,1664525)+1013904223)>>>0;
 return seed/4294967296;
}
function save(){
 try{localStorage.setItem(KEY,String(unlocked))}catch(e){}
}
function setup(n){
 level=n;playing=false;paused=false;finished=false;
 frame=0;world=0;score=0;spawn=0;obstacles=[];particles=[];
 plane={x:145,y:240,vy:0,r:19};
 seed=(n*7919+20261118)>>>0;
 speed=2.8+n*.025;
 goal=1800+n*38;
 $("levelLabel").textContent="المرحلة "+level+" من 100";
 $("message").textContent="تجنّب الحواجز واجمع النجوم!";
 $("start").textContent="▶ ابدأ";
 $("pause").textContent="⏸ إيقاف";
 refresh();
 draw();
}
function refresh(){
 $("stars").textContent="⭐ "+score;
 $("distance").textContent="المسافة "+Math.min(100,Math.floor(world/goal*100))+"%";
 $("best").textContent="المراحل المفتوحة: "+unlocked;
 $("prev").disabled=level<=1;
 $("next").disabled=level>=unlocked;
 const sel=$("levels");
 sel.replaceChildren();
 for(let i=1;i<=unlocked;i++){
  const o=document.createElement("option");
  o.value=i;o.textContent="المرحلة "+i;sel.append(o);
 }
 sel.value=String(level);
}
function start(){
 if(finished||world>=goal)setup(level);
 playing=true;paused=false;
 $("message").textContent="حلّق بحذر!";
 $("start").textContent="▶ متابعة";
}
function spawnObstacle(){
 const hard=Math.min(1,level/100);
 const gap=185-hard*65+random()*25;
 const center=125+random()*250;
 const top=Math.max(45,center-gap/2);
 const bottom=Math.min(H-50,center+gap/2);
 obstacles.push({x:W+60,top,bottom,w:48+hard*17,passed:false});
 if(random()>.15){
  particles.push({x:W+125,y:top+(bottom-top)*(.25+random()*.5),r:12,used:false});
 }
}
function collide(o){
 const x=plane.x,y=plane.y,r=plane.r-4;
 return x+r>o.x&&x-r<o.x+o.w&&(y-r<o.top||y+r>o.bottom);
}
function fail(){
 playing=false;finished=true;
 $("message").textContent="اصطدمت الطائرة! حاول مرة ثانية.";
 $("start").textContent="↻ حاول مجددًا";
}
function win(){
 playing=false;finished=true;
 if(level===unlocked&&unlocked<100){unlocked++;save()}
 $("message").textContent=level===100?
 "رائع! أنهيت جميع مراحل الطيران!":
 "نعم! أنهيت المرحلة "+level+" وفتحت المرحلة التالية!";
 $("start").textContent="↻ العب مجددًا";
 refresh();
}
function update(dt){
 if(!playing||paused)return;
 const f=Math.min(2,dt/16.67);
 frame+=f;
 const move=(input.down?1:0)-(input.up?1:0);
 plane.vy+=move*.65*f;
 if(!move)plane.vy*=Math.pow(.87,f);
 plane.vy=Math.max(-5.8,Math.min(5.8,plane.vy));
 plane.y+=plane.vy*f;
 plane.y=Math.max(30,Math.min(H-30,plane.y));
 world+=speed*f;
 spawn+=speed*f;
 const interval=Math.max(260,420-level*1.15);
 if(spawn>=interval){
  spawn=0;
  spawnObstacle();
 }
 for(const o of obstacles){
  o.x-=speed*f;
  if(collide(o)){fail();return}
  if(!o.passed&&o.x+o.w<plane.x){
   o.passed=true;
   score+=2;
  }
 }
 for(const s of particles){
  s.x-=speed*f;
  if(!s.used&&Math.hypot(s.x-plane.x,s.y-plane.y)<plane.r+s.r){
   s.used=true;score+=5;
  }
 }
 obstacles=obstacles.filter(o=>o.x+o.w>-20);
 particles=particles.filter(s=>s.x>-20&&!s.used);
 if(world>=goal){win();return}
 if(Math.floor(frame)%12===0)refresh();
}
function cloud(x,y,s){
 ctx.fillStyle="rgba(255,255,255,.75)";
 for(const [a,b,r] of [[0,0,22],[24,-9,29],[53,0,23]]){
  ctx.beginPath();ctx.arc(x+a*s,y+b*s,r*s,0,Math.PI*2);ctx.fill();
 }
}
function star(x,y,r){
 ctx.fillStyle="#ffbd21";ctx.strokeStyle="#c27b05";ctx.lineWidth=2;
 ctx.beginPath();
 for(let i=0;i<10;i++){
  const a=-Math.PI/2+i*Math.PI/5;
  const rr=i%2?r*.46:r;
  const xx=x+Math.cos(a)*rr,yy=y+Math.sin(a)*rr;
  if(i===0)ctx.moveTo(xx,yy);else ctx.lineTo(xx,yy);
 }
 ctx.closePath();ctx.fill();ctx.stroke();
}
function drawPlane(){
 ctx.save();ctx.translate(plane.x,plane.y);
 ctx.rotate(Math.max(-.22,Math.min(.22,plane.vy*.04)));
 ctx.fillStyle="#ef7737";
 ctx.beginPath();ctx.moveTo(30,0);ctx.lineTo(-30,-14);ctx.lineTo(-30,14);ctx.closePath();ctx.fill();
 ctx.fillStyle="#fff5d9";
 ctx.beginPath();ctx.ellipse(0,0,28,13,0,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#3579be";
 ctx.beginPath();ctx.moveTo(-5,-6);ctx.lineTo(-19,-31);ctx.lineTo(7,-9);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(-5,7);ctx.lineTo(-20,28);ctx.lineTo(8,10);ctx.closePath();ctx.fill();
 ctx.fillStyle="#65c6ef";ctx.beginPath();ctx.arc(11,-3,7,0,Math.PI*2);ctx.fill();
 ctx.fillStyle="#ef7737";ctx.fillRect(-32,-21,8,22);
 ctx.restore();
}
function draw(){
 const sky=ctx.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#72caff");sky.addColorStop(1,"#d9f5ff");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);
 for(let i=0;i<8;i++){
  const x=((i*179-world*.18)%(W+220)+(W+220))%(W+220)-100;
  cloud(x,55+(i*73)%260,.7+(i%3)*.2);
 }
 ctx.fillStyle="#a2d7a4";
 for(let i=0;i<14;i++){
  const x=((i*105-world*.28)%(W+130)+(W+130))%(W+130)-80;
  ctx.beginPath();ctx.moveTo(x,H);ctx.lineTo(x+65,H-65-(i%4)*18);ctx.lineTo(x+135,H);ctx.fill();
 }
 ctx.fillStyle="#68b67d";ctx.fillRect(0,H-20,W,20);
 for(const o of obstacles){
  ctx.fillStyle="#7b8b99";
  ctx.fillRect(o.x,0,o.w,o.top);
  ctx.fillRect(o.x,o.bottom,o.w,H-o.bottom);
  ctx.fillStyle="#c7d5de";
  ctx.fillRect(o.x-5,o.top-13,o.w+10,13);
  ctx.fillRect(o.x-5,o.bottom,o.w+10,13);
  ctx.fillStyle="#f5f8fa";
  for(let y=20;y<o.top-15;y+=35)ctx.fillRect(o.x+8,y,o.w-16,7);
  for(let y=o.bottom+25;y<H;y+=35)ctx.fillRect(o.x+8,y,o.w-16,7);
 }
 for(const s of particles)star(s.x,s.y,s.r);
 drawPlane();
 ctx.fillStyle="#fff";ctx.fillRect(20,18,W-40,12);
 ctx.fillStyle="#ff9d29";ctx.fillRect(20,18,(W-40)*Math.min(1,world/goal),12);
 ctx.strokeStyle="#45708b";ctx.strokeRect(20,18,W-40,12);
 if(!playing){
  ctx.fillStyle="rgba(15,53,80,.13)";ctx.fillRect(0,0,W,H);
  ctx.fillStyle="#fff";ctx.font="bold 28px Tahoma";ctx.textAlign="center";
  ctx.fillText(finished?"انتهت الجولة":"استعد للطيران!",W/2,80);
 }
}
function loop(t){
 const dt=last?t-last:16.67;last=t;
 update(dt);draw();requestAnimationFrame(loop);
}
function bindHold(id,dir){
 const el=$(id);
 const down=e=>{e.preventDefault();input[dir]=true;try{el.setPointerCapture(e.pointerId)}catch(x){}};
 const up=e=>{e.preventDefault();input[dir]=false};
 el.addEventListener("pointerdown",down);
 el.addEventListener("pointerup",up);
 el.addEventListener("pointercancel",up);
 el.addEventListener("lostpointercapture",()=>input[dir]=false);
}
bindHold("up","up");bindHold("down","down");
document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","Space","KeyW","KeyS"].includes(e.code))e.preventDefault();
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=true;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=true;
 if(e.code==="Space"&&!e.repeat){
  if(!playing)start();else paused=!paused;
 }
});
document.addEventListener("keyup",e=>{
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=false;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=false;
});
window.addEventListener("blur",()=>{input.up=false;input.down=false;if(playing)paused=true});
$("start").onclick=start;
$("retry").onclick=()=>{setup(level);start()};
$("pause").onclick=()=>{
 if(!playing)return;
 paused=!paused;
 $("message").textContent=paused?"اللعبة متوقفة مؤقتًا":"تابع الطيران!";
 $("pause").textContent=paused?"▶ متابعة":"⏸ إيقاف";
};
$("prev").onclick=()=>setup(Math.max(1,level-1));
$("next").onclick=()=>setup(Math.min(unlocked,level+1));
$("levels").onchange=e=>setup(Number(e.target.value));
setup(1);
requestAnimationFrame(loop);
</script>
</body></html>
