<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>الطيران - محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eaf6ff;color:#18364d}
header{text-align:center;background:linear-gradient(110deg,#ffb35b,#ffe2a0);padding:15px}
h1{margin:0;font-size:27px}
main{max-width:1000px;margin:auto;padding:12px}
nav,.controls,.stats{display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;margin:12px 0}
button,select{font-family:inherit;border:0;border-radius:12px;background:#ffae48;padding:12px 15px;font-size:16px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
a{color:#19445f;font-weight:bold}
.stats span{background:white;border-radius:10px;padding:9px 13px}
canvas{display:block;width:100%;border:4px solid white;border-radius:18px;background:#8bd5ff;touch-action:none}
#message{text-align:center;font-size:19px;font-weight:bold;min-height:48px;padding:12px}
.control{min-width:120px;min-height:70px;background:#fff}
small{display:block;text-align:center;color:#526b7c;margin:12px}
</style>
</head>
<body>
<header><h1>✈️ الطيران</h1><div>مغامرات محمد وحبيبة</div></header>
<main>
<nav>
<a href="index.html">العودة إلى الألعاب</a>
<button id="prev">المرحلة السابقة</button>
<select id="levels"></select>
<button id="next">المرحلة التالية</button>
</nav>
<div class="stats">
<span id="levelText"></span>
<span id="timer"></span>
<span id="stars"></span>
<span id="progress"></span>
</div>
<canvas id="game" width="900" height="500"></canvas>
<div id="message">استعد للطيران!</div>
<div class="controls">
<button class="control" id="up">⬆ ارتفاع</button>
<button class="control" id="down">⬇ انخفاض</button>
<button id="start">▶ ابدأ</button>
<button id="pause">⏸ إيقاف</button>
<button id="restart">↻ إعادة المرحلة</button>
</div>
<small>الكمبيوتر: الأسهم أو W و S. الهاتف: اضغط باستمرار على أزرار الارتفاع والانخفاض.</small>
</main>
<script>
"use strict";

const c=document.getElementById("game");
const x=c.getContext("2d");
const $=id=>document.getElementById(id);
const W=900,H=500;
const SAVE="mh_flight_progress_v1";
const DURATION=180;
const APPROACH=14;
const LANDING=9;

let unlocked=1;
try{
 unlocked=Math.min(100,Math.max(1,Number(localStorage.getItem(SAVE))||1));
}catch(e){}

let level=1,mode="ready",elapsed=0,approachTime=0,landingTime=0;
let plane={x:145,y:245,vy:0};
let input={up:false,down:false};
let obstacles=[],stars=[],score=0;
let distance=0,spawnDistance=0,seed=1;
let lastTime=0,hitFlash=0;
let runwayX=930;

function rng(){
 seed=(Math.imul(seed,1664525)+1013904223)>>>0;
 return seed/4294967296;
}
function save(){
 try{localStorage.setItem(SAVE,String(unlocked));}catch(e){}
}
function message(s){$("message").textContent=s;}
function reset(n){
 level=n;
 mode="ready";
 elapsed=0;approachTime=0;landingTime=0;
 plane={x:145,y:245,vy:0};
 obstacles=[];stars=[];score=0;
 distance=0;spawnDistance=0;
 seed=(20261118+level*7919)>>>0;
 runwayX=930;
 input.up=false;input.down=false;
 $("start").textContent="▶ ابدأ";
 $("pause").textContent="⏸ إيقاف";
 message("الهدف: حلّق 3 دقائق ثم اهبط في المطار.");
 refresh();
 draw();
}
function refresh(){
 $("levelText").textContent="المرحلة "+level+" / 100";
 const left=Math.max(0,Math.ceil(DURATION-elapsed));
 $("timer").textContent="الوقت المتبقي: "+Math.floor(left/60)+":"+String(left%60).padStart(2,"0");
 $("stars").textContent="⭐ "+score;
 $("progress").textContent="المراحل المفتوحة: "+unlocked;
 $("prev").disabled=level===1;
 $("next").disabled=level>=unlocked;
 const select=$("levels");
 if(select.options.length!==unlocked){
  select.replaceChildren();
  for(let i=1;i<=unlocked;i++){
   const o=document.createElement("option");
   o.value=i;o.textContent="المرحلة "+i;
   select.append(o);
  }
 }
 select.value=String(level);
}
function begin(){
 if(mode==="won"||mode==="crashed")reset(level);
 if(mode==="ready"||mode==="paused"){
  mode=elapsed>=DURATION?"approach":"flying";
  $("pause").textContent="⏸ إيقاف";
  message("حلّق بحذر واجمع النجوم!");
 }
}
function spawn(){
 const difficulty=(level-1)/99;
 const gap=205-difficulty*55+rng()*25;
 const center=140+rng()*215;
 const top=Math.max(48,center-gap/2);
 const bottom=Math.min(450,center+gap/2);
 const width=42+difficulty*23;
 const obj={px:W+30,top,bottom,width};
 obstacles.push(obj);
 if(rng()>.15){
  stars.push({
   px:W+width+65,
   y:top+(bottom-top)*(.3+rng()*.4),
   taken:false
  });
 }
}
function crash(){
 mode="crashed";
 hitFlash=.5;
 message("اصطدمت الطائرة! أعد المحاولة.");
 $("start").textContent="↻ حاول مجددًا";
}
function win(){
 mode="won";
 if(level===unlocked&&unlocked<100){
  unlocked++;
  save();
 }
 message(level===100?
  "نعم! أنهيت جميع مراحل الطيران!":
  "نعم! هبطت الطائرة بسلام في المطار، وفتحت المرحلة التالية!");
 $("start").textContent="↻ العب مجددًا";
 refresh();
}
function update(dt){
 if(mode==="paused"||mode==="ready"||mode==="crashed"||mode==="won")return;
 const s=Math.min(.05,dt);
 const speed=155+(level-1)*1.1;
 hitFlash=Math.max(0,hitFlash-s);

 if(mode==="flying"){
  elapsed+=s;
  const axis=(input.down?1:0)-(input.up?1:0);
  plane.vy+=axis*800*s;
  if(axis===0)plane.vy*=Math.pow(.055,s);
  plane.vy=Math.max(-270,Math.min(270,plane.vy));
  plane.y+=plane.vy*s;
  plane.y=Math.max(36,Math.min(H-40,plane.y));

  distance+=speed*s;
  spawnDistance+=speed*s;

  const spacing=Math.max(335,480-(level-1)*1.1);
  if(spawnDistance>=spacing){
   spawnDistance=0;
   spawn();
  }

  for(const o of obstacles){
   o.px-=speed*s;
   if(plane.x+17>o.px&&plane.x-17<o.px+o.width &&
     (plane.y-14<o.top||plane.y+14>o.bottom)){
    crash();return;
   }
  }
  for(const star of stars){
   star.px-=speed*s;
   if(!star.taken&&Math.hypot(star.px-plane.x,star.y-plane.y)<29){
    star.taken=true;score+=5;
   }
  }
  obstacles=obstacles.filter(o=>o.px+o.width>-20);
  stars=stars.filter(z=>z.px>-20&&!z.taken);

  if(elapsed>=DURATION){
   elapsed=DURATION;
   mode="approach";
   approachTime=0;
   obstacles=[];
   stars=[];
   message("ظهر المطار! استعد للهبوط.");
  }
 }
 else if(mode==="approach"){
  approachTime+=s;
  plane.vy*=Math.pow(.05,s);
  const target=215;
  plane.y+=(target-plane.y)*Math.min(1,s*.65);
  if(approachTime>=APPROACH){
   mode="landing";
   landingTime=0;
   message("الطائرة تقترب من المدرج...");
  }
 }
 else if(mode==="landing"){
  landingTime+=s;
  const p=Math.min(1,landingTime/LANDING);
  const smooth=p*p*(3-2*p);
  plane.y=215+(404-215)*smooth;
  plane.x=145+(330-145)*smooth;
  if(landingTime>=LANDING)win();
 }
 refresh();
}
function cloud(px,py,size){
 x.fillStyle="rgba(255,255,255,.78)";
 for(const [dx,dy,r] of [[0,0,22],[22,-10,28],[48,0,23]]){
  x.beginPath();
  x.arc(px+dx*size,py+dy*size,r*size,0,Math.PI*2);
  x.fill();
 }
}
function drawStar(px,py){
 x.save();x.translate(px,py);
 x.fillStyle="#ffbf25";x.strokeStyle="#d08b00";x.lineWidth=2;
 x.beginPath();
 for(let i=0;i<10;i++){
  const a=-Math.PI/2+i*Math.PI/5;
  const r=i%2?6:13;
  if(i===0)x.moveTo(Math.cos(a)*r,Math.sin(a)*r);
  else x.lineTo(Math.cos(a)*r,Math.sin(a)*r);
 }
 x.closePath();x.fill();x.stroke();x.restore();
}
function drawPlane(){
 x.save();
 x.translate(plane.x,plane.y);
 const angle=mode==="flying"?Math.max(-.2,Math.min(.2,plane.vy/850)):0;
 x.rotate(angle);
 x.fillStyle="#e97535";
 x.beginPath();
 x.moveTo(33,0);x.lineTo(-29,-14);x.lineTo(-29,14);
 x.closePath();x.fill();
 x.fillStyle="#fff5e0";
 x.beginPath();x.ellipse(0,0,29,13,0,0,Math.PI*2);x.fill();
 x.fillStyle="#327fbd";
 x.beginPath();
 x.moveTo(-7,-6);x.lineTo(-18,-30);x.lineTo(9,-9);
 x.closePath();x.fill();
 x.beginPath();
 x.moveTo(-7,7);x.lineTo(-19,29);x.lineTo(9,10);
 x.closePath();x.fill();
 x.fillStyle="#71c6f2";
 x.beginPath();x.arc(12,-3,7,0,Math.PI*2);x.fill();
 x.fillStyle="#e97535";x.fillRect(-32,-21,7,22);
 x.restore();
}
function airport(){
 const t=mode==="approach"?Math.min(1,approachTime/APPROACH):
  mode==="landing"||mode==="won"?1:0;
 const offset=(1-t)*W;
 x.save();x.translate(offset,0);
 x.fillStyle="#76b987";x.fillRect(0,405,W,95);
 x.fillStyle="#434b56";x.fillRect(0,420,W,75);
 x.fillStyle="#fff9d6";
 for(let i=0;i<8;i++)x.fillRect(i*125+15,454,66,5);
 x.fillStyle="#f5f7fa";x.fillRect(620,300,225,107);
 x.fillStyle="#a5bdcb";x.fillRect(605,293,255,16);
 x.fillStyle="#75b6dc";
 for(let i=0;i<5;i++)x.fillRect(642+i*39,325,25,36);
 x.fillStyle="#f5f7fa";x.fillRect(775,250,34,60);
 x.fillStyle="#4c687c";x.fillRect(768,239,48,18);
 x.fillStyle="#ffce69";
 x.beginPath();x.arc(791,238,9,0,Math.PI*2);x.fill();
 x.fillStyle="#1b485b";x.font="bold 22px Tahoma";
 x.textAlign="center";x.fillText("المطار",730,390);
 x.restore();
}
function draw(){
 const sky=x.createLinearGradient(0,0,0,H);
 sky.addColorStop(0,"#76cbff");sky.addColorStop(1,"#def6ff");
 x.fillStyle=sky;x.fillRect(0,0,W,H);
 for(let i=0;i<9;i++){
  const px=((i*165-distance*.2)%(W+240)+(W+240))%(W+240)-100;
  cloud(px,60+(i*79)%270,.7+(i%3)*.17);
 }
 if(["approach","landing","won"].includes(mode)){
  airport();
 }else{
  x.fillStyle="#a1d5aa";
  for(let i=0;i<12;i++){
   const px=((i*125-distance*.3)%(W+150)+(W+150))%(W+150)-80;
   x.beginPath();x.moveTo(px,H);
   x.lineTo(px+65,H-80-(i%4)*18);
   x.lineTo(px+135,H);x.fill();
  }
  x.fillStyle="#6dbb7b";x.fillRect(0,H-17,W,17);
 }
 for(const o of obstacles){
  x.fillStyle="#8296a4";
  x.fillRect(o.px,0,o.width,o.top);
  x.fillRect(o.px,o.bottom,o.width,H-o.bottom);
  x.fillStyle="#d6e0e8";
  x.fillRect(o.px-5,o.top-12,o.width+10,12);
  x.fillRect(o.px-5,o.bottom,o.width+10,12);
  x.fillStyle="#eff8ff";
  for(let yy=20;yy<o.top-15;yy+=36)
   x.fillRect(o.px+8,yy,o.width-16,7);
  for(let yy=o.bottom+25;yy<H;yy+=36)
   x.fillRect(o.px+8,yy,o.width-16,7);
 }
 for(const z of stars)drawStar(z.px,z.y);
 drawPlane();
 x.fillStyle="rgba(255,255,255,.9)";
 x.fillRect(20,18,860,12);
 x.fillStyle="#ff9e32";
 x.fillRect(20,18,860*Math.min(1,elapsed/DURATION),12);
 x.strokeStyle="#44718b";x.strokeRect(20,18,860,12);
 if(mode==="ready"||mode==="paused"||mode==="crashed"||mode==="won"){
  x.fillStyle="rgba(18,49,75,.16)";x.fillRect(0,0,W,H);
  x.fillStyle="#fff";x.textAlign="center";x.font="bold 29px Tahoma";
  const labels={
   ready:"استعد للطيران!",
   paused:"اللعبة متوقفة مؤقتًا",
   crashed:"حاول مرة ثانية",
   won:"وصلت إلى المطار!"
  };
  x.fillText(labels[mode],W/2,85);
 }
 if(hitFlash>0){
  x.fillStyle="rgba(255,90,60,"+(hitFlash*.3)+")";
  x.fillRect(0,0,W,H);
 }
}
function loop(now){
 const dt=lastTime?Math.min(.05,(now-lastTime)/1000):0;
 lastTime=now;
 update(dt);
 draw();
 requestAnimationFrame(loop);
}
function hold(id,direction){
 const b=$(id);
 b.addEventListener("pointerdown",e=>{
  e.preventDefault();input[direction]=true;
  try{b.setPointerCapture(e.pointerId)}catch(err){}
 });
 for(const type of ["pointerup","pointercancel","lostpointercapture"]){
  b.addEventListener(type,()=>input[direction]=false);
 }
}
hold("up","up");
hold("down","down");
document.addEventListener("keydown",e=>{
 if(["ArrowUp","ArrowDown","KeyW","KeyS","Space"].includes(e.code))
  e.preventDefault();
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=true;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=true;
 if(e.code==="Space"&&!e.repeat){
  if(mode==="ready"||mode==="paused")begin();
  else if(mode==="flying"||mode==="approach"||mode==="landing")pause();
 }
});
document.addEventListener("keyup",e=>{
 if(e.code==="ArrowUp"||e.code==="KeyW")input.up=false;
 if(e.code==="ArrowDown"||e.code==="KeyS")input.down=false;
});
window.addEventListener("blur",()=>{
 input.up=false;input.down=false;
 if(["flying","approach","landing"].includes(mode))pause();
});
let previousMode="flying";
function pause(){
 if(mode==="paused"){
  mode=previousMode;
  $("pause").textContent="⏸ إيقاف";
  message("تابع الطيران!");
 }else if(["flying","approach","landing"].includes(mode)){
  previousMode=mode;
  mode="paused";
  $("pause").textContent="▶ متابعة";
  message("اللعبة متوقفة مؤقتًا.");
 }
}
$("start").onclick=begin;
$("pause").onclick=pause;
$("restart").onclick=()=>{reset(level);begin()};
$("prev").onclick=()=>reset(Math.max(1,level-1));
$("next").onclick=()=>reset(Math.min(unlocked,level+1));
$("levels").onchange=e=>reset(Number(e.target.value));
reset(1);
requestAnimationFrame(loop);
</script>
</body>
</html>
