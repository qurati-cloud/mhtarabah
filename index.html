let age='little',g=null,lv=1,token=0,finished=false,task=null,chosenColor='#f6b544',media=null,recorder=null,chunks=[],audioCtx=null;
const storageKey=(id)=>'mh_v2_'+age+'_'+id;function read(id){try{return JSON.parse(localStorage.getItem(storageKey(id)))||{unlocked:1,stars:{}}}catch{return {unlocked:1,stars:{}}}}function save(id,data){try{localStorage.setItem(storageKey(id),JSON.stringify(data))}catch{}}
function show(id){['home','menu','play'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function chooseAge(a){stopMedia();token++;age=a;$('ageTitle').textContent=a==='little'?'من 3 إلى 6 سنوات':'من 6 إلى 12 سنة';$('gameList').replaceChildren();G[a].forEach(item=>{let d=read(item[0]),b=document.createElement('button');b.className='game';b.innerHTML=`<span class="ico">${item[1]}</span><span>${item[2]}</span><small>وصلت إلى المرحلة ${d.unlocked} من 100</small>`;b.onclick=()=>start(item);$('gameList').append(b)});if(a==='older'){

function start(item){stopMedia();token++;g=item;lv=Math.min(100,read(g[0]).unlocked);show('play');render()}function stopMedia(){if(recorder&&recorder.state==='recording')recorder.stop();recorder=null;if(media){media.getTracks().forEach(t=>t.stop());media=null}if(audioCtx){audioCtx.close().catch(()=>{});audioCtx=null}}
function changeLevel(n){if(!g)return;let to=lv+n,d=read(g[0]);if(to<1||to>Math.min(100,d.unlocked))return;lv=to;token++;stopMedia();render()}function resetCurrent(){token++;stopMedia();render()}
function win(){if(finished)return;finished=true;let d=read(g[0]);d.stars[lv]=Math.max(d.stars[lv]||0,3);d.unlocked=Math.max(d.unlocked,Math.min(100,lv+1));save(g[0],d);$('message').textContent=lv===100?'🏆 نعم! أنهيت 100 مرحلة!':'🌟 نعم! فتحت المرحلة التالية';$('nextBtn').disabled=lv===100; if(lv<100){let t=token;setTimeout(()=>{if(token===t&&g){lv++;token++;render()}},1200)}}

function node(tag,cls,text,parent=$('board')){let e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;parent.append(e);return e}function prompt(t){$('prompt').textContent=t}function note(t){$('message').textContent=t}function btn(t,fn,parent=$('board'),cls=''){let b=node('button',cls,t,parent);b.onclick=fn;return b}function choices(arr,answer,success=win){let c=node('div','choices');shuffle(arr).forEach(x=>btn(String(x),()=>{if(String(x)===String(answer)){note('نعم!');success()}else note('حاول مرة أخرى')},c))}function stages(target,caption){task.hits++;note('نعم! '+task.hits+' / '+target);if(task.hits>=target)win();else if(caption)prompt(caption)}
const items=['🏠','🕌','🌳','🌷','🌙','⭐','🚗','🚀','🍎','📚','🔑','🪟','⛲','🧺','🍋','🏡'];

function quiz(){let id=g[0],q,opts,ans;if(id==='sounds'){let a=[['مواء','قط'],['نباح','كلب'],['صهيل','حصان'],['ثغاء','خروف'],['زقزقة','عصفور']];let x=a[(lv-1)%a.length];q='أي حيوان يصدر صوت '+x[0]+'؟';ans=x[1];opts=shuffle([ans,...a.filter(y=>y!==x).map(y=>y[1])]).slice(0,4);if(!opts.includes(ans))opts[0]=ans}

else {let x=words[(lv-1)%words.length];q='اختر معنى الصورة '+x[1];ans=x[0];opts=[ans,...words.filter(y=>y[0]!==ans).map(y=>y[0]).slice(lv%6,lv%6+3)]}prompt(q);choices(opts,ans)}
function count(){let n=1+(lv%Math.min(18,3+Math.ceil(lv/7))),sym=pick(['🍎','🌷','⭐','🟠','🌙']);prompt('كم عدد الرموز؟');node('div','big',sym.repeat(n));choices([n,n+1,Math.max(0,n-1),n+2].map(String),String(n))}

function memory(){let n=Math.min(10,2+Math.floor((lv-1)/10)),symbols=shuffle(items).slice(0,n),cards=shuffle([...symbols,...symbols]);let opened=[],done=new Set(),locked=false;prompt('اكشف البطاقات وتذكّر مكان كل زوج');let c=node('div','tilegrid');let buttons=cards.map((x,i)=>btn('؟',()=>{if(locked||done.has(i)||opened.includes(i))return;opened.push(i);buttons[i].textContent=x;if(opened.length===2){let [a,b]=opened;if(cards[a]===cards[b]){done.add(a);done.add(b);opened=[];buttons[a].style.background='#d4efd2';buttons[b].style.background='#d4efd2';if(done.size===cards.length)win()}else{locked=true;let t=token;setTimeout(()=>{if(t!==token)return;buttons[a].textContent='؟';buttons[b].textContent='؟';opened=[];locked=false},700)}}},c));}

function paint(){prompt('اختر لونًا ولوّن أجزاء المشهد، ثم اضغط إنهاء');let colors=['#f3c344','#eb7777','#79c783','#7cb4ed','#a78bd4','#a97851','#eeeeee'];let pal=node('div','palette');colors.forEach(c=>{let b=btn(' ',()=>{chosenColor=c;pal.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on')},pal,'swatch');b.style.background=c;if(c===chosenColor)b.classList.add('on')});let scene=lv%5;let shapes=[['<rect x="15" y="165" width="370" height="95"/>','<rect x="120" y="95" width="160" height="130"/>','<polygon points="105,100 200,30 295,100"/>','<rect x="180" y="160" width="40" height="65"/>','<circle cx="330" cy="55" r="28"/>'],['<rect x="20" y="185" width="360" height="70"/>','<rect x="100" y="105" width="200" height="130"/>','<path d="M100 105 Q200 -5 300 105Z"/>','<rect x="178" y="165" width="44" height="70"/>','<rect x="62" y="45" width="28" height="190"/>','<path d="M56 45 L76 12 L96 45Z"/>'],['<rect x="20" y="190" width="360" height="65"/>','<rect x="70" y="105" width="30" height="125"/>','<circle cx="85" cy="80" r="53"/>','<rect x="300" y="120" width="25" height="110"/>','<circle cx="312" cy="95" r="43"/>'],['<rect x="20" y="190" width="360" height="65"/>','<polygon points="20,190 125,40 230,190"/>','<polygon points="165,190 280,30 385,190"/>','<circle cx="60" cy="48" r="24"/>'],['<rect x="20" y="190" width="360" height="65"/>','<rect x="110" y="100" width="180" height="135"/>','<path d="M110 100 Q200 -10 290 100Z"/>','<rect x="175" y="160" width="50" height="75"/>','<rect x="65" y="50" width="28" height="185"/>','<path d="M60 50 L79 12 L98 50Z"/>']][scene];let div=node('div');let svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 400 280');svg.setAttribute('class','drawing');div.append(svg);let used=new Set();shapes.forEach((html,i)=>{let holder=document.createElementNS('http://www.w3.org/2000/svg','g');holder.innerHTML=html;let el=holder.firstElementChild;el.setAttribute('fill','#fff' function recipe(){let recipes=[['سلطة فواكه',['🍎','🍌','🍇']],['عصير الليمون',['🍋','💧','🥤']],['سلطة خضار',['🥒','🍅','🥬']],['ساندويتش',['🍞','🧀','🥬']]];let [name,ingredients]=recipes[(lv-1)%4],used=new Set();prompt('حضّر '+name+': اختر المكونات الصحيحة');let c=node('div','choices');shuffle([...ingredients,...['🍉','🍯','🥕','🥔'].filter(x=>!ingredients.includes(x)).slice(0,3)]).forEach(x=>btn(x,()=>{if(!ingredients.includes(x)){note('هذا المكوّن غير مطلوب');return}used.add(x);note('نعم! '+used.size+'/'+ingredients.length);if(used.size===ingredients.length)win()},c))}
function garden(){let steps=['حضّر التربة','ازرع البذور','اسقِ النبات','عرّضه لضوء الشمس'];let ix=0;prompt('اعتنِ بالنبتة بالترتيب');node('div','scene','🌱');let c=node('div','choices');shuffle(steps).forEach(x=>btn(x,()=>{if(x!==steps[ix])return note('جرّب خطوة أخرى');ix++;note('نعم! '+ix+'/'+steps.length);if(ix===steps.length)win()},c))}
function shop(){let goods=[['🍎',3],['📚',7],['🥖',2],['🍋',4],['🧃',5]],x=goods[(lv-1)%goods.length],qty=1+(lv%5);prompt('اشترِ '+qty+' من '+x[0]+'، ثمن القطعة '+x[1]+' نقاط. كم المجموع؟');choices([qty*x[1],qty*x[1]+x[1],qty*x[1]+2,Math.max(0,qty*x[1]-x[1])],qty*x[1])}
function fix(){let steps=['🔍 افحص اللعبة','🪛 فكّ الجزء','🔧 أصلح الجزء','✅ أعد التركيب'];let i=0;prompt('أصلح اللعبة بالترتيب الصحيح');node('div','scene','🚗 🐱 🪀');let c=node('div','choices');shuffle(steps).forEach(x=>btn(x,()=>{if(x!==steps[i])return note('جرّب خطوة أخرى');i++;note('نعم!');if(i===4)win()},c))}
function adventure(){let q=[['وجد محمد طريقين، أيهما يصل إلى المسجد؟','طريق المسجد',['طريق المسجد','طريق السوق']],['تريد حبيبة عبور الطريق، ماذا تفعل؟','تنتظر إشارة العبور',['تنتظر إشارة العبور','تعبر دون انتباه']],['أين يضع محمد الكتاب بعد القراءة؟','على الرف',['على الرف','على الأرض']]];let x=q[(lv-1)%q.length];prompt(x[0]);node('div','scene','🏡 🕌 🌳');choices(x[2],x[1])}
function drive(){let lane=1,hits=0,goal=3+Math.floor(lv/15);prompt('تجنّب الحواجز: انتقل يمينًا أو يسارًا');let road=node('div','road'),car=node('div','car','🚗',road);let ob=node('div','obstacle','🚧',road);let pos=rand(3);function draw(){car.style.left=(lane*33+8)+'%';ob.style.left=(pos*33+8)+'%';ob.style.top='22px'}draw();let c=node('div','actions');btn('⬅',()=>move(-1),c);btn('➡',()=>move(1),c);btn('تقدّم',()=>{if(lane===pos)return note('اصطدمت بالحاجز، غيّر المسار');hits++;if(hits>=goal)return win();pos=rand(3);draw();note('نعم! '+hits+'/'+goal)},c);function move(d){lane=Math.max(0,Math.min(2,lane+d));draw()}}
function pet(){let d;try{d=JSON.parse(localStorage.getItem('mh_pet_state'))}catch{}if(!d)d={food:45,clean:50,energy:50,joy:45};prompt('هذه الصور من باب الفرض والتقدير وليست حقيقية');node('div','scene','✨ 🐱 ✨');let m=node('div','meters');let names=[['food','الشبع'],['clean','النظافة'],['energy','الطاقة'],['joy','السعادة']];names.forEach(([k,t])=>{let e=node('div','meter',t,m),p=node('progress','',undefined,e);p.max=100;p.value=d[k]});let c=node('div','choices');[['🍎 إطعام','food'],['🧼 تنظيف','clean'],['🛌 راحة','energy'],['🧩 لعب','joy']].forEach(([t,k])=>btn(t,()=>{d[k]=Math.min(100,d[k]+20);localStorage.setItem('mh_pet_state',JSON.stringify(d));task.hits++;note('نعم! '+task.hits+'/'+(4+Math.floor(lv/10)));if(task.hits>=4+Math.floor(lv/10))win();else{names.forEach(([kk],i)=>m.children[i].querySelector('progress').value=d[kk])}},c))}
function voice(){prompt('سجّل صوتك ثم جرّب تغييره — دون موسيقى');node('p','warn','يعمل التسجيل بإذن الميكروفون وفي اتصال آمن (HTTPS أو localhost). لا تُرفع التسجيلات إلى خادم.');let status=node('p','','لم يبدأ التسجيل'),c=node('div','actions'),audio=node('audio');audio.controls=true;audio.style.maxWidth='100%';let blob=null,url=null;btn('🎙️ ابدأ التسجيل',async()=>{try{stopMedia();media=await navigator.mediaDevices.getUserMedia({audio:true});chunks=[];recorder=new MediaRecorder(media);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{blob=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(blob);audio.src=url;status.textContent='التسجيل جاهز';media?.getTracks().forEach(t=>t.stop());media=null};recorder.start();status.textContent='جارٍ التسجيل...'}catch(e){status.textContent='تعذّر تشغيل الميكروفون: '+e.message}},c);btn('⏹ إيقاف',()=>{if(recorder?.state==='recording')recorder.stop()},c);$('board').append(audio);let modes=[['عادي',1],['صوت غليظ',.72],['صوت رفيع',1.4],['بطيء',.8],['سريع',1.3]];let opts=node('div','choices');modes.forEach(([t,rate])=>btn(t,()=>{audio.playbackRate=rate;audio.preservesPitch=false;audio.mozPreservesPitch=false;audio.webkitPreservesPitch=false;if(audio.src)audio.play().catch(()=>{});else note('سجّل صوتك أولًا')},opts));btn('🗑 حذف التسجيل',()=>{audio.pause();audio.removeAttribute('src');audio.load();if(url)URL.revokeObjectURL(url);url=null;blob=null;status.textContent='حُذف التسجيل'},c);btn('إنهاء المرحلة',()=>blob?win():note('سجّل صوتًا أولًا'),c)}
function math(){let a=1+lv%Math.min(90,10+lv),b=1+(lv*3)%Math.min(35,6+lv),op=lv<20?'+':lv<40?'−':lv<70?'×':'÷',ans;if(op==='−'){if(a<b)[a,b]=[b,a];ans=a-b}else if(op==='×')ans=a*b;else if(op==='÷'){a=a*b;ans=a/b}else ans=a+b;prompt(a+' '+op+' '+b+' = ؟');choices([ans,ans+1,ans+3,Math.max(0,ans-2)],ans)}
function logic(){let mode=lv%3,seq,ans;if(mode===0){let n=2+lv%9;seq=[n,n*2,n*3,n*4];ans=n*5}else if(mode===1){let n=1+lv%7;seq=[n,n+3,n+6,n+9];ans=n+12}else{let n=2+lv%5;seq=[n,n*n,n*n*n];ans=n*n*n*n}prompt('أكمل النمط: '+seq.join(' ، ')+' ، ؟');choices([ans,ans+1,ans+3,Math.max(0,ans-2)],ans)}
function cipher(){let alphabet='ابتثجحخدذرزسشصضطظعغفقكلمنهوي',idx=(lv-1)%alphabet.length,shift=1+Math.floor(lv/30),original=alphabet[idx],encoded=alphabet[(idx+shift)%alphabet.length];prompt('كل حرف يتحرّك '+shift+' خطوة في الأبجدية. فكّ الرمز: '+encoded);choices([original,alphabet[(idx+1)%alphabet.length],alphabet[(idx+3)%alphabet.length],alphabet[(idx+5)%alphabet.length]],original)}
function detective(){let people=['محمد','حبيبة','سامر','ليلى'],target=people[lv%4];prompt('المحقق الصغير: الشاهد يقول إن الاسم يبدأ بحرف «'+target[0]+'». من المقصود؟');choices(people,target)}
function lab(){let tests=[['أي مادة تذوب في الماء عادة؟','الملح',['الملح','الحجر','الخشب']],['ما الذي تحتاج إليه النبتة لتنمو؟','الماء والضوء',['الماء والضوء','الظلام فقط','الحجارة']],['ماذا يحدث للماء عند التجميد؟','يصير جليدًا',['يصير جليدًا','يصير رملًا','يصير خشبًا']],['أي مادة تنجذب إلى المغناطيس؟','الحديد',['الحديد','الورق','الزجاج']]];let x=tests[(lv-1)%4];prompt('🧪 '+x[0]);choices(x[2],x[1])}
function build(){let budget=4+Math.floor(lv/10),used=0;prompt('ابنِ مدينة: أضف '+budget+' مبانٍ');let c=node('div','choices'),scene=node('div','scene','🏡');['🏠 بيت','🕌 مسجد','🏫 مدرسة','🏥 مستشفى','🌳 حديقة'].forEach(x=>btn(x,()=>{if(used>=budget)return;used++;scene.textContent+=' '+x.split(' ')[0];if(used>=budget)win();else note('بقي '+(budget-used))},c))}
function business(){let price=2+(lv%15),cost=1+(lv%5),qty=2+(lv%8);prompt('بعت '+qty+' قطع، سعر القطعة '+price+' وتكلفتها '+cost+'. كم الربح؟');let ans=(price-cost)*qty;choices([ans,ans+qty,ans+2,ans+price],ans)}
function bridge(){let length=3+Math.floor(lv/12),placed=0;prompt('ابنِ جسرًا من '+length+' ألواح');node('div','scene','🌊　　　　🌊');let display=node('div','big','—');btn('🪵 ضع لوحًا',()=>{placed++;display.textContent='🪵'.repeat(placed);if(placed>=length)win()})}
function hospital(){let cases=[['مريض يحتاج إلى قياس الحرارة','ميزان الحرارة',['ميزان الحرارة','المسطرة','القلم']],['مريض يحتاج إلى ماء','كوب ماء',['كوب ماء','مفتاح','كتاب']],['يجب تنظيف اليدين قبل الفحص','غسل اليدين',['غسل اليدين','اللعب','الكتابة']]];let x=cases[(lv-1)%3];prompt('🏥 '+x[0]);choices(x[2],x[1])}
function football(){let goal=['يمين','وسط','يسار'][lv%3];prompt('⚽ سدّد نحو '+goal);choices(['يمين','وسط','يسار'],goal)}
function robot(){let n=2+Math.floor(lv/12),steps=Array.from({length:n},(_,i)=>i%2?'يمين':'أمام');prompt('برمج الروبوت: نفّذ الأوامر بالترتيب');node('div','scene','🤖');let i=0,c=node('div','actions');['أمام','يمين','يسار'].forEach(x=>btn(x,()=>{if(x!==steps[i])return note('الأمر غير صحيح');i++;note('نعم! '+i+'/'+n);if(i===n)win()},c))}
function island(){let steps=['اجمع الخشب','ابنِ كوخًا','ازرع شجرة','ابنِ قاربًا'];let i=0;prompt('🏝️ اكتشف الجزيرة ونفّذ المهام بالترتيب');let c=node('div','choices');shuffle(steps).forEach(x=>btn(x,()=>{if(x!==steps[i])return note('جرّب مهمة أخرى');i++;if(i===steps.length)win();else note('نعم! '+i+'/'+steps.length)},c))}
function code(){let steps=['تقدّم','انعطف يمينًا','تقدّم','انعطف يسارًا'];let goal=steps.slice(0,2+lv%3),i=0;prompt('اكتب برنامجًا صحيحًا: '+goal.join(' ← '));let c=node('div','choices');['تقدّم','انعطف يمينًا','انعطف يسارًا'].forEach(x=>btn(x,()=>{if(x!==goal[i])return note('الأمر غير صحيح');i++;if(i===goal.length)win();else note('نعم! '+i+'/'+goal.length)},c))}
function maze(){let size=Math.min(9,4+Math.floor(lv/20)),x=0,y=0,goalX=size-1,goalY=size-1;prompt('صل إلى المربع الأخضر باستخدام الأسهم');let grid=node('div','gridcells');grid.style.setProperty('--cols',size);let cells=[];for(let j=0;j<size*size;j++)cells.push(node('div','cell','',grid));function draw(){cells.forEach((c,i)=>{let xx=i%size,yy=Math.floor(i/size);c.className='cell'+(xx===goalX&&yy===goalY?' goal':'')+(xx===x&&yy===y?' player':'');c.textContent=xx===x&&yy===y?'🚶':xx===goalX&&yy===goalY?'⭐':''})}draw();let controls=node('div','actions');[['⬆',0,-1],['⬇',0,1],['⬅',-1,0],['➡',1,0]].forEach(([t,dx,dy])=>btn(t,()=>{x=Math.max(0,Math.min(size-1,x+dx));y=Math.max(0,Math.min(size-1,y+dy));draw();if(x===goalX&&y===goalY)win()},controls))}
function navigate(){let target=lv%4,dirs=['شمال','جنوب','شرق','غرب'];prompt('🚀 اتجه إلى '+dirs[target]+' للوصول إلى المحطة');choices(dirs,dirs[target])}
function chess(){prompt('♟ تعرّف على حركة القطع (تدريب تمهيدي، وليس مباراة شطرنج كاملة)');let data=[['أي قطعة تتحرك على شكل حرف L؟','الحصان',['الحصان','القلعة','الفيل']],['أي قطعة تتحرك قطريًا؟','الفيل',['الفيل','القلعة','الحصان']],['أي قطعة تتحرك أفقيًا وعموديًا؟','القلعة',['القلعة','الفيل','الحصان']]];let x=data[(lv-1)%data.length];node('div','notice','الرسوم النصية هنا خالية من الصلبان');choices(x[2],x[1])}
const engines={quiz,count,find,memory,sort,puzzle,paint,balloon,tidy,clean,dress,recipe,garden,shop,fix,adventure,drive,pet,voice,math,logic,cipher,detective,lab,build,business,bridge,hospital,football,robot,island,code,maze,navigate,chess};function unsupported(){prompt('هذه اللعبة قيد التطوير')}
</script></body></html>
