<script type="module">
window.mhGameTextDefaults={"m1":"انتهت المحاولة! جمعت {score} نجوم. اضغط ابدأ للمحاولة من جديد.","m2":"اجمع النجوم وتجاوز الحواجز!","m3":"اللعبة متوقفة مؤقتًا","m4":"تابع المغامرة!","m5":"جاهز للمغامرة؟","m6":"اللعبة متوقفة","m7":"انتهت المحاولة!","m8":"حدث خطأ أثناء تشغيل اللعبة: ","m9":"▶ متابعة","m10":"⏸ إيقاف"};
function gameText(id){const key=location.pathname.split('/').pop()+':message:'+id;return window.mhGameTextValues?.[key] ?? window.mhGameTextDefaults[id];}

import { installArcade } from "./arcade/scene.js";
import { progress as progressStorage } from "./auth/progress.js";
import {connect,connectRunnerGuest} from "./auth/firebase.js";
"use strict";
const view3d=null; document.getElementById("scene-3d").style.display="none";

const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const W=900,H=500,GROUND=410;
const KEY="mh_platform_hurdles_v1";

const mohammadImages={
 run:new Image(),
 jump:new Image(),
 duck:new Image()
};

mohammadImages.run.src="mohammad-run.png";
mohammadImages.jump.src="mohammad-jump.png";
mohammadImages.duck.src="mohammad-duck.png";

let selectedCharacter="mohammad";
const habibaSheet=new Image();
let habibaFrames=[];
function prepareHabibaSheet(){
 const fw=habibaSheet.naturalWidth/4,fh=habibaSheet.naturalHeight/2;
 const c=document.createElement("canvas");c.width=habibaSheet.naturalWidth;c.height=habibaSheet.naturalHeight;
 const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(habibaSheet,0,0);
 const pixels=g.getImageData(0,0,c.width,c.height).data;
 habibaFrames=Array.from({length:8},(_,i)=>{
  const x0=Math.round(i%4*fw),x1=Math.round((i%4+1)*fw),y0=Math.round(Math.floor(i/4)*fh),y1=Math.round((Math.floor(i/4)+1)*fh);
  let l=x1,r=-1,t=y1,b=-1;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(pixels[(y*c.width+x)*4+3]>40){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y);}
  return r>=l?{x:l,y:t,w:r-l+1,h:b-t+1}:null;
 });
}
habibaSheet.onload=prepareHabibaSheet;
habibaSheet.src="habiba-running-sheet.png";
function drawHabibaSheet(pose,x,y){
 const frames=[0,1,3,4,5,2];
 const i=pose==="duck"?7:pose==="jump"?6:frames[Math.floor(clock*(6+Math.min(10,speed/235)*1.2))%frames.length];
 const b=habibaFrames[i];if(!b)return false;
 const size=CHARACTER[pose],scale=Math.min(size.w/b.w,size.h/b.h);
 ctx.drawImage(habibaSheet,b.x,b.y,b.w,b.h,x-b.w*scale/2,y-b.h*scale,b.w*scale,b.h*scale);
 return true;
}

const habibaImages={run:new Image(),jump:new Image(),duck:new Image()};
for(const [pose,img] of Object.entries(habibaImages))img.src="habiba-"+pose+".png";
let mode="ready",last=0,clock=0;
let distance=0,score=0,speed=235,elapsed=0;
let obstacles=[],stars=[];
let obstacleTimer=2,starTimer=1;
let runner={x:130,y:0,vy:0};
let downHeld=false,duckUntil=0;
let touchId=null,touchY=0,touchDirection="";
let saved={distance:0,starRecord:0,totalStars:0,level:1};
let level=1,worldX=100,feet=GROUND,vy=0,grounded=true,facing=1,camera=0,terrain=[],hazards=[],goal=0,held=new Set(),checkpoint=100;

try{
 const old=JSON.parse(progressStorage.getItem(KEY));
 if(old&&typeof old==="object"){
  for(const k of Object.keys(saved)){
   const n=Number(old[k]);
   if(Number.isFinite(n)&&n>=0)saved[k]=n;
  }
 }
}catch(e){}

let leaderboard;
let globalRecord={distance:0,stars:0};
function showGlobal(){
 $("global").textContent=String(globalRecord.distance);
 $("globalStars").textContent=globalRecord.stars+" ⭐";
}
async function publishGlobal(){
 return; // Separate platform records from legacy endless-run records.
 if(!leaderboard || saved.distance<1)return;
 const {db,data}=leaderboard.auth.currentUser?.emailVerified?leaderboard:await connectRunnerGuest();
 const ref=data.doc(db,"runnerWorldRecords","hurdles-platform");
 await data.runTransaction(db,async tx=>{
  const prev=(await tx.get(ref)).data()||{distance:0,stars:0};
  const next={distance:Math.max(prev.distance,Math.floor(saved.distance)),stars:Math.max(prev.stars,Math.floor(saved.starRecord))};
  if(next.distance!==prev.distance||next.stars!==prev.stars)tx.set(ref,next);
 });
}
connect().then(connection=>{
 if(!connection)return;
 leaderboard=connection;
 const {data,db,auth,authApi}=connection;
 data.onSnapshot(data.doc(db,"runnerWorldRecords","hurdles"),snap=>{
  if(snap.metadata.fromCache&&!snap.exists())return;
  globalRecord=snap.data()||{distance:0,stars:0};showGlobal();
 },error=>console.warn("Hurdles world record unavailable",error));
 authApi.onAuthStateChanged(auth,user=>{if(user?.emailVerified)publishGlobal().catch(console.warn);});
 publishGlobal().catch(console.warn);
}).catch(console.warn);
function save(){
 try{progressStorage.setItem(KEY,JSON.stringify(saved))}catch(e){}
}

function rand(a,b){return a+Math.random()*(b-a)}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function round(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function starShape(x,y,r){
 ctx.beginPath();
 for(let i=0;i<10;i++){
  let a=-Math.PI/2+i*Math.PI/5;
  let rr=i%2?r*.47:r;
  let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
  if(i===0)ctx.moveTo(px,py);
  else ctx.lineTo(px,py);
 }
 ctx.closePath();
 ctx.fillStyle="#ffdc35";ctx.fill();
 ctx.strokeStyle="#c88b05";ctx.lineWidth=3;ctx.stroke();
}

function isDuck(){
 return runner.y===0&&(downHeld||clock<duckUntil);
}


const CHARACTER={
 run:{w:110,h:125},
 jump:{w:110,h:125},
 duck:{w:115,h:72}
};

function characterPose(){
 if(!grounded)return "jump";
 if(isDuck())return "duck";
 return "run";
}



function playerBox(){
 const pose=characterPose();
 const size=CHARACTER[pose];
 const w=pose==="duck"?70:55;
 const h=pose==="duck"?43:pose==="jump"?104:108;
 return {
  x:runner.x+(size.w-w)/2,
  y:GROUND-runner.y-h,
  w:w,
  h:h
 };
}



function reset(){
 level=Math.max(1,Math.min(30,Math.floor(saved.level||1))); worldX=100;feet=GROUND;vy=0;grounded=true;camera=0;clock=elapsed=score=distance=0;held.clear();terrain=[];hazards=[];stars=[];checkpoint=100;
 let x=0; const sections=5+Math.floor(level/3);
 for(let i=0;i<sections;i++){
  const width=620+(i%3)*90;terrain.push({x,y:GROUND,w:width,h:90});
  if(i>0)hazards.push({x:x+230,y:GROUND-42,w:42,h:42});
  for(let j=0;j<3;j++){const px=x+125+j*145,py=GROUND-110-(j%2)*65;terrain.push({x:px,y:py,w:115,h:20});stars.push({x:px+57,y:py-35,r:15});}
  stars.push({x:x+width-75,y:GROUND-40,r:15});
  x+=width+(i===sections-1?0:85+Math.min(55,level*2));
 }
 goal=x-100; runner.x=worldX-55;runner.y=0;
}
function start(){reset();mode="running";$("message").textContent="اجمع النجوم حتى تصل إلى نهاية المرحلة!";}
function jump(){if(mode==="running"&&grounded){vy=-690;grounded=false;}}
function pause(){if(mode==="running"){mode="paused";held.clear();}else if(mode==="paused")mode="running";}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function crash(){mode="crashed";held.clear();$("message").textContent="حاول مجددًا!";}
function finish(){mode="won";held.clear();saved.distance=Math.max(saved.distance,level);saved.starRecord=Math.max(saved.starRecord,score);saved.totalStars+=score;saved.level=Math.min(30,level+1);save();$("message").textContent=level===30?"أتممت جميع المراحل!":"أحسنت! انتقلت إلى المرحلة التالية."; }
function update(dt){
 if(mode!=="running")return;clock+=dt;elapsed+=dt;
 const dir=Number(held.has("right"))-Number(held.has("left"));if(dir)facing=dir;
 const oldFeet=feet;worldX=Math.max(25,Math.min(goal+40,worldX+dir*270*dt));vy+=1550*dt;feet+=vy*dt;grounded=false;
 for(const p of terrain){if(vy>=0&&oldFeet<=p.y+1&&feet>=p.y&&worldX+23>p.x&&worldX-23<p.x+p.w){feet=p.y;vy=0;grounded=true;}}
 const box={x:worldX-23,y:feet-95,w:46,h:95};
 if(feet>H+100||hazards.some(h=>overlap(box,h))){crash();return;}
 for(const star of stars)if(!star.collected&&overlap(box,{x:star.x-15,y:star.y-15,w:30,h:30})){star.collected=true;score++;}
 camera=Math.max(0,Math.min(goal-W+130,worldX-260));distance=Math.max(distance,worldX/15);runner.x=worldX-camera-55;runner.y=GROUND-feet;
 if(worldX>=goal&&grounded)finish();
}
function background(){
 const sky=ctx.createLinearGradient(0,0,0,GROUND);
 sky.addColorStop(0,"#7ccaff");
 sky.addColorStop(1,"#e6faff");
 rect(0,0,W,GROUND,sky);

 circle(750,85,43,"#ffe17b");

 for(let i=0;i<6;i++){
  const x=((i*210-distance*1.4)%(W+250)+(W+250))%(W+250)-100;
  const y=80+i%3*38;
  circle(x,y,23,"#ffffffbb");
  circle(x+28,y-9,30,"#ffffffbb");
  circle(x+55,y,22,"#ffffffbb");
 }

 for(let i=0;i<9;i++){
  const x=((i*160-distance*2)%(W+200)+(W+200))%(W+200)-80;
  circle(x,GROUND-22,44,"#79c88d");
  circle(x+20,GROUND-39,37,"#91dca0");
 }

 rect(0,GROUND,W,H-GROUND,"#7299b5");
 

 for(let i=0;i<15;i++){
  const x=((i*100-distance*8)%(W+100)+(W+100))%(W+100);
  
 }
}



const runningSheet=new Image();
runningSheet.src="mohammad-running-frames.png";
const RUN_FRAMES=8;

const spriteBounds={};

const runFrameBounds=[];
let runUniformScale=1;

function prepareRunningFrames(){
 if(!runningSheet.complete||!runningSheet.naturalWidth)return;

 const fw=runningSheet.naturalWidth/RUN_FRAMES;
 const fh=runningSheet.naturalHeight;

 const c=document.createElement("canvas");
 c.width=runningSheet.naturalWidth;
 c.height=fh;

 const g=c.getContext("2d",{willReadFrequently:true});
 g.drawImage(runningSheet,0,0);

 const pixels=g.getImageData(0,0,c.width,c.height).data;

 runFrameBounds.length=0;

 for(let frame=0;frame<RUN_FRAMES;frame++){
  const x0=Math.round(frame*fw);
  const x1=Math.round((frame+1)*fw);

  let left=x1,top=fh,right=-1,bottom=-1;

  for(let y=0;y<fh;y++){
   for(let x=x0;x<x1;x++){
    if(pixels[(y*c.width+x)*4+3]>30){
     left=Math.min(left,x);
     right=Math.max(right,x);
     top=Math.min(top,y);
     bottom=Math.max(bottom,y);
    }
   }
  }

  if(right>=left){
   runFrameBounds.push({
    x:left,y:top,
    w:right-left+1,
    h:bottom-top+1
   });
  }else{
   runFrameBounds.push({
    x:x0,y:0,w:x1-x0,h:fh
   });
  }
 }

 const maxW=Math.max(...runFrameBounds.map(b=>b.w));
 const maxH=Math.max(...runFrameBounds.map(b=>b.h));

 runUniformScale=Math.min(
  CHARACTER.run.w/maxW,
  CHARACTER.run.h/maxH
 );

}

if(runningSheet.complete&&runningSheet.naturalWidth){
 prepareRunningFrames();
}else{
 runningSheet.addEventListener(
  "load",prepareRunningFrames,{once:true}
 );
}


function getSpriteBounds(img,pose){
 if(spriteBounds[pose])return spriteBounds[pose];

 const c=document.createElement("canvas");
 c.width=img.naturalWidth;
 c.height=img.naturalHeight;
 const g=c.getContext("2d",{willReadFrequently:true});
 g.drawImage(img,0,0);

 const data=g.getImageData(0,0,c.width,c.height).data;
 let left=c.width,top=c.height,right=-1,bottom=-1;

 for(let y=0;y<c.height;y++){
  for(let x=0;x<c.width;x++){
   if(data[(y*c.width+x)*4+3]>25){
    left=Math.min(left,x);
    right=Math.max(right,x);
    top=Math.min(top,y);
    bottom=Math.max(bottom,y);
   }
  }
 }

 const bounds=right>=left
  ?{x:left,y:top,w:right-left+1,h:bottom-top+1}
  :{x:0,y:0,w:c.width,h:c.height};

 spriteBounds[pose]=bounds;
 return bounds;
}


function prepareMohammadImages(){
 for(const [pose,img] of Object.entries(mohammadImages)){
  const prepare=()=>{
   try{
    if(img.naturalWidth>0&&!spriteBounds[pose]){
     getSpriteBounds(img,pose);
    }
   }catch(error){
    console.warn("Sprite preparation:",pose,error);
   }
  };
  if(img.complete)prepare();
  else img.addEventListener("load",prepare,{once:true});
 }
}
prepareMohammadImages();

// Animated side-view character, used until custom sprite artwork is supplied.
function drawHabibaFallback(pose,centerX,footY){
 const crouch=pose==="duck", jumpPose=pose==="jump";
 const phase=clock*(6+Math.min(10,speed/235)*1.2)*Math.PI/4;
 const swing=pose==="run"?Math.sin(phase):0;
 ctx.save();ctx.translate(centerX,footY);ctx.scale(1,crouch?.57:1);
 ctx.translate(crouch?12:0,0);ctx.rotate(crouch?.32:.10);
 const ellipse=(x,y,rx,ry,color)=>{ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,Math.PI*2);ctx.fill();};
 const limb=(points,width,color)=>{ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();};
 for(const side of [-1,1]){
  const stride=jumpPose?side*19:swing*side*24;
  const lift=jumpPose?12:Math.max(0,-swing*side)*13;
  limb([[0,-43],[stride*.6,-25-lift*.4],[stride,-8-lift]],13,side<0?"#613278":"#843b9c");
  ellipse(stride+5,-5-lift,10,5,"#f5eef9");
  ellipse(stride+5,-2-lift,10,2,"#493950");
 }
 limb([[-3,-83],[-17-swing*15,-66],[-8-swing*20,-55]],10,"#8540a1");
 ellipse(-8-swing*20,-55,5,5,"#eeb48a");
 const fabric=ctx.createLinearGradient(-22,-70,22,-45);fabric.addColorStop(0,"#69268b");fabric.addColorStop(.6,"#ad50ce");fabric.addColorStop(1,"#80329d");
 ctx.fillStyle=fabric;ctx.beginPath();ctx.moveTo(-15,-88);ctx.quadraticCurveTo(9,-91,16,-72);ctx.lineTo(22,-43);ctx.quadraticCurveTo(0,-34,-25,-43);ctx.lineTo(-17,-75);ctx.closePath();ctx.fill();
 limb([[-22,-44],[0,-39],[20,-44]],3,"#eec568");
 // The scarf is drawn under the chin and over the entire neck.
 ellipse(-5,-104,24,26,"#8c30b8");ellipse(-8,-107,20,23,"#b94ae0");
 ctx.fillStyle="#efb68f";ctx.beginPath();ctx.moveTo(5,-123);ctx.bezierCurveTo(19,-123,22,-111,22,-105);ctx.lineTo(27,-100);ctx.lineTo(21,-96);ctx.quadraticCurveTo(19,-88,8,-87);ctx.quadraticCurveTo(-1,-89,-1,-101);ctx.quadraticCurveTo(-2,-115,5,-123);ctx.fill();
 ellipse(15,-108,2.8,3.7,"#35231f");ellipse(16,-109,1,1,"white");
 limb([[11,-115],[18,-116]],1.6,"#623b36");limb([[17,-94],[21,-95]],1.4,"#a15350");
 ctx.fillStyle="#9d39c6";ctx.beginPath();ctx.moveTo(-23,-110);ctx.quadraticCurveTo(-14,-88,9,-87);ctx.lineTo(20,-88);ctx.quadraticCurveTo(19,-79,5,-76);ctx.quadraticCurveTo(-13,-78,-28,-89);ctx.closePath();ctx.fill();
 limb([[-19,-104],[-20,-92],[-6,-84]],2,"#d276ec");
 limb([[9,-77],[22+swing*12,-63],[35+swing*15,-73]],11,"#a647c4");
 ellipse(35+swing*15,-73,5.5,5.5,"#efb68f");
 ctx.restore();
}
function drawMohammad(){
 const pose=characterPose();
 const size=CHARACTER[pose];
 const footY=GROUND-runner.y+2;
 const centerX=runner.x+55;

 ctx.save();
 ctx.globalAlpha=.16;
 ctx.fillStyle="#000";
 ctx.beginPath();
 ctx.ellipse(centerX,GROUND+4,36,6,0,0,Math.PI*2);
 ctx.fill();
 ctx.restore();

 if(selectedCharacter==="habiba"&&drawHabibaSheet(pose,centerX,footY))return;
 if(selectedCharacter==="mohammad"&&pose==="run"&&runningSheet.complete&&runningSheet.naturalWidth>0){
  const ratio=Math.max(1,Math.min(10,speed/235));
  const fps=6+ratio*1.2;
  const frame=Math.floor(clock*fps)%(RUN_FRAMES-1);

  const bounds=runFrameBounds[frame];

  if(bounds){
   const w=bounds.w*runUniformScale;
   const h=bounds.h*runUniformScale;

   ctx.drawImage(
    runningSheet,
    bounds.x,bounds.y,bounds.w,bounds.h,
    centerX-w/2,footY-h,w,h
   );
   return;
  }
 }

 const img=selectedCharacter==="habiba"?habibaImages[pose]:mohammadImages[pose];
 if(selectedCharacter==="habiba"&&!(img.complete&&img.naturalWidth>0)){drawHabibaFallback(pose,centerX,footY);return;}

 if(img.complete&&img.naturalWidth>0){
  const key=selectedCharacter==="habiba"?"habiba-"+pose:pose;
  const bounds=spriteBounds[key]||getSpriteBounds(img,key);
  const scale=Math.min(
   size.w/bounds.w,
   size.h/bounds.h
  );

  const w=bounds.w*scale;
  const h=bounds.h*scale;

  ctx.drawImage(
   img,
   bounds.x,bounds.y,bounds.w,bounds.h,
   centerX-w/2,footY-h,w,h
  );
 }else{
  ctx.fillStyle="#28458f";
  ctx.fillRect(
   centerX-size.w/2,
   footY-size.h,
   size.w,size.h
  );
 }
}



function drawObstacle(o){
 if(o.type==="ground"){
  round(o.x,o.y,o.w,o.h,5,"#ae7045");
  ctx.strokeStyle="#70462e";
  ctx.lineWidth=4;
  ctx.strokeRect(o.x+5,o.y+5,o.w-10,o.h-10);
  ctx.beginPath();
  ctx.moveTo(o.x+7,o.y+7);
  ctx.lineTo(o.x+o.w-7,o.y+o.h-7);
  ctx.moveTo(o.x+o.w-7,o.y+7);
  ctx.lineTo(o.x+7,o.y+o.h-7);
  ctx.stroke();
 }else{
  round(o.x,o.y,o.w,o.h,8,"#a66cdd");
  round(o.x+5,o.y+5,o.w-10,12,5,"#e6c2ff");
  ctx.fillStyle="white";
  ctx.font="bold 27px Arial";
  ctx.textAlign="center";
  ctx.fillText("↓",o.x+o.w/2,o.y+36);
 }
}

function draw(){
 if(view3d){
  view3d.render(obstacles,stars,distance*15,elapsed);
  ctx.clearRect(0,0,W,H);
 }else{
  background();
  for(const p of terrain){round(p.x-camera,p.y,p.w,p.h,5,"#b78350");round(p.x-camera,p.y,p.w,12,4,"#58b95c");}
  for(const s of stars)if(!s.collected)starShape(s.x-camera,s.y,s.r);
  for(const h of hazards)drawObstacle({...h,x:h.x-camera,type:"ground"});
  rect(goal-camera,GROUND-155,7,155,"#79532d");round(goal-camera+7,GROUND-155,70,45,5,"#f9ca46");
 }
 ctx.save();if(facing<0){const cx=runner.x+55;ctx.translate(cx*2,0);ctx.scale(-1,1);}drawMohammad();ctx.restore();

 if(mode!=="running"){
  ctx.fillStyle="#17283b88";
  ctx.fillRect(0,0,W,GROUND);
  ctx.textAlign="center";
  ctx.fillStyle="white";
  ctx.font="bold 40px Tahoma,Arial";
  const labels={
   ready:gameText("m5"),
   paused:gameText("m6"),
   crashed:gameText("m7"),won:"أحسنت!"
  };
  ctx.fillText(labels[mode]||"",W/2,105);
 }

 (($("distance")) || {textContent:""}).textContent=Math.floor(distance);
 (($("stars")) || {textContent:""}).textContent=score+" ⭐";
 (($("speed")) || {textContent:""}).textContent=level+" / 30";
 const seconds=Math.floor(elapsed);
 (($("time")) || {textContent:""}).textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+":"+
  String(seconds%60).padStart(2,"0");
 (($("record")) || {textContent:""}).textContent=Math.floor(saved.distance);
 (($("starRecord")) || {textContent:""}).textContent=saved.starRecord+" ⭐";
 (($("totalStars")) || {textContent:""}).textContent=saved.totalStars+" ⭐";
 document.querySelectorAll("[data-character]").forEach(b=>b.disabled=mode==="running"||mode==="paused");
 $("start").hidden=mode==="running"||mode==="paused";$("start").textContent=mode==="won"?"المرحلة التالية":mode==="crashed"?"حاول مجددًا":"▶ ابدأ";$("pause").disabled=mode!=="running"&&mode!=="paused";
 (($("pause")) || {textContent:""}).textContent=mode==="paused"?gameText("m9"):gameText("m10");
}

function loop(now){
 requestAnimationFrame(loop);
 try{
  const dt=last?Math.min(.04,(now-last)/1000):0;
  last=now;
  for(let left=dt;left>0;left-=1/120)update(Math.min(left,1/120));
  draw();
 }catch(error){
  console.error("Game loop error:",error);
  const message=document.getElementById("message");
  if(message){
   message.textContent=gameText("m8")+error.message;
  }
 }
}

document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{
 if(mode==="running"||mode==="paused")return;
 selectedCharacter=b.dataset.character;
 document.querySelectorAll('[data-character]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});
$("start").onclick=start;
$("pause").onclick=pause;

const keys={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right"};
document.addEventListener("keydown",e=>{if(keys[e.code]){e.preventDefault();held.add(keys[e.code]);}if(["ArrowUp","KeyW","Space"].includes(e.code)){e.preventDefault();if(!e.repeat)jump();}});
document.addEventListener("keyup",e=>{if(keys[e.code])held.delete(keys[e.code]);});
for(const id of ["left","right","up"]){const button=$(id);button.addEventListener("pointerdown",e=>{e.preventDefault();button.setPointerCapture(e.pointerId);if(id==="up")jump();else held.add(id);});for(const event of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(event,()=>held.delete(id));}
window.addEventListener("blur",()=>{held.clear();if(mode==="running")pause();});
reset();
requestAnimationFrame(loop);
</script>
