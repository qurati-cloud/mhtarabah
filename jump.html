<style>
*{box-sizing:border-box}

.top{margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

<script type="module">
window.mhGameTextDefaults={"m1":"انتهت المحاولة! جمعت {score} نجوم. اضغط ابدأ للمحاولة من جديد.","m2":"اجمع النجوم وتجاوز الحواجز!","m3":"اللعبة متوقفة مؤقتًا","m4":"تابع المغامرة!","m5":"جاهز للمغامرة؟","m6":"اللعبة متوقفة","m7":"انتهت المحاولة!","m8":"حدث خطأ أثناء تشغيل اللعبة: ","m9":"▶ متابعة","m10":"⏸ إيقاف"};
function gameText(id){const key=location.pathname.split('/').pop()+':message:'+id;return window.mhGameTextValues?.[key] ?? window.mhGameTextDefaults[id];}

import { installArcade } from "./arcade/scene.js";
import { progress as progressStorage } from "./auth/progress.js";
import {connect,connectRunnerGuest} from "./auth/firebase.js";
"use strict";
const view3d=null; document.getElementById("scene-3d").style.display="none";
const stage=document.getElementById("arcade-stage");document.getElementById("full-game").onclick=async()=>{try{if(stage.requestFullscreen)await stage.requestFullscreen();else stage.classList.toggle("adventure-full");}catch{stage.classList.toggle("adventure-full");}};document.getElementById("leave-full").onclick=()=>{if(document.fullscreenElement)document.exitFullscreen();stage.classList.remove("adventure-full");};

const $=id=>document.getElementById(id);
const canvas=$("game"),ctx=canvas.getContext("2d");
const W=900,H=500,GROUND=410;
const KEY="mh_obstacles_v1";

const mohammadImages={
 run:new Image(),
 jump:new Image(),
 duck:new Image()
};

mohammadImages.run.src="mohammad-run.png";
mohammadImages.jump.src="mohammad-jump.png";
mohammadImages.duck.src="mohammad-duck.png";

let selectedCharacter="mohammad";
const habibaSheet=new Image();
let habibaFrames=[];
function prepareHabibaSheet(){
 const fw=habibaSheet.naturalWidth/4,fh=habibaSheet.naturalHeight/2;
 const c=document.createElement("canvas");c.width=habibaSheet.naturalWidth;c.height=habibaSheet.naturalHeight;
 const g=c.getContext("2d",{willReadFrequently:true});g.drawImage(habibaSheet,0,0);
 const pixels=g.getImageData(0,0,c.width,c.height).data;
 habibaFrames=Array.from({length:8},(_,i)=>{
  const x0=Math.round(i%4*fw),x1=Math.round((i%4+1)*fw),y0=Math.round(Math.floor(i/4)*fh),y1=Math.round((Math.floor(i/4)+1)*fh);
  let l=x1,r=-1,t=y1,b=-1;
  for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++)if(pixels[(y*c.width+x)*4+3]>40){l=Math.min(l,x);r=Math.max(r,x);t=Math.min(t,y);b=Math.max(b,y);}
  return r>=l?{x:l,y:t,w:r-l+1,h:b-t+1}:null;
 });
}
habibaSheet.onload=prepareHabibaSheet;
habibaSheet.src="habiba-running-sheet.png";
function drawHabibaSheet(pose,x,y){
 const frames=[0,1,3,4,5,2];
 const i=pose==="duck"?7:pose==="jump"?6:frames[(held.has("left")||held.has("right"))?Math.floor(clock*9)%frames.length:0];
 const b=habibaFrames[i];if(!b)return false;
 const size=CHARACTER[pose],scale=Math.min(size.w/b.w,size.h/b.h);
 ctx.drawImage(habibaSheet,b.x,b.y,b.w,b.h,x-b.w*scale/2,y-b.h*scale,b.w*scale,b.h*scale);
 return true;
}

const habibaImages={run:new Image(),jump:new Image(),duck:new Image()};
for(const [pose,img] of Object.entries(habibaImages))img.src="habiba-"+pose+".png";
let mode="ready",last=0,clock=0;
let distance=0,score=0,speed=235,elapsed=0;
let obstacles=[],stars=[];
let obstacleTimer=2,starTimer=1;
let runner={x:130,y:0,vy:0};
let downHeld=false,duckUntil=0;
let touchId=null,touchY=0,touchDirection="";
let saved={distance:0,starRecord:0,totalStars:0,level:1,keys:0,extra:0,armor:0,magnet:0,ammo:0,flight:0,jewels:0,claimedLevel:0,claimedMask:0,ammoMask:0};
let powerups=[],shots=[],particles=[],fireUntil=0,shield=false,lastFire=-10,keysFound=0,treasures=[],worldTheme=0,night=false; let level=1,worldX=100,feet=GROUND,vy=0,grounded=true,facing=1,camera=0,terrain=[],hazards=[],goal=0,held=new Set(),checkpoint=100;

try{
 const old=JSON.parse(progressStorage.getItem(KEY))?.adventure || JSON.parse(progressStorage.getItem("mh_platform_hurdles_v1"));
 if(old&&typeof old==="object"){
  for(const k of Object.keys(saved)){
   const n=Number(old[k]);
   if(Number.isFinite(n)&&n>=0)saved[k]=n;
  }
 }
}catch(e){}

let leaderboard;
let globalRecord={distance:0,stars:0};
function showGlobal(){
 $("global").textContent=String(globalRecord.distance);
 $("globalStars").textContent=globalRecord.stars+" ⭐";
}
async function publishGlobal(){
 return; // Separate platform records from legacy endless-run records.
 if(!leaderboard || saved.distance<1)return;
 const {db,data}=leaderboard.auth.currentUser?.emailVerified?leaderboard:await connectRunnerGuest();
 const ref=data.doc(db,"runnerWorldRecords","hurdles-platform");
 await data.runTransaction(db,async tx=>{
  const prev=(await tx.get(ref)).data()||{distance:0,stars:0};
  const next={distance:Math.max(prev.distance,Math.floor(saved.distance)),stars:Math.max(prev.stars,Math.floor(saved.starRecord))};
  if(next.distance!==prev.distance||next.stars!==prev.stars)tx.set(ref,next);
 });
}
connect().then(connection=>{
 if(!connection)return;
 leaderboard=connection;
 const {data,db,auth,authApi}=connection;
 data.onSnapshot(data.doc(db,"runnerWorldRecords","hurdles"),snap=>{
  if(snap.metadata.fromCache&&!snap.exists())return;
  globalRecord=snap.data()||{distance:0,stars:0};showGlobal();
 },error=>console.warn("Hurdles world record unavailable",error));
 authApi.onAuthStateChanged(auth,user=>{if(user?.emailVerified)publishGlobal().catch(console.warn);});
 publishGlobal().catch(console.warn);
}).catch(console.warn);
function save(){
 try{progressStorage.setItem(KEY,JSON.stringify({...JSON.parse(progressStorage.getItem(KEY)||"{}"),adventure:saved}))}catch(e){}
}

function rand(a,b){return a+Math.random()*(b-a)}
function rect(x,y,w,h,color){
 ctx.fillStyle=color;ctx.fillRect(x,y,w,h);
}
function round(x,y,w,h,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);ctx.fill();
}
function circle(x,y,r,color){
 ctx.fillStyle=color;ctx.beginPath();
 ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
}
function starShape(x,y,r){
 ctx.beginPath();
 for(let i=0;i<10;i++){
  let a=-Math.PI/2+i*Math.PI/5;
  let rr=i%2?r*.47:r;
  let px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr;
  if(i===0)ctx.moveTo(px,py);
  else ctx.lineTo(px,py);
 }
 ctx.closePath();
 ctx.fillStyle="#ffdc35";ctx.fill();
 ctx.strokeStyle="#c88b05";ctx.lineWidth=3;ctx.stroke();
}

function isDuck(){
 return grounded&&held.has("down");
}


const CHARACTER={
 run:{w:110,h:125},
 jump:{w:110,h:125},
 duck:{w:115,h:72}
};

function characterPose(){
 if(!grounded)return "jump";
 if(isDuck())return "duck";
 return "run";
}



function playerBox(){
 const pose=characterPose();
 const size=CHARACTER[pose];
 const w=pose==="duck"?70:55;
 const h=pose==="duck"?43:pose==="jump"?104:108;
 return {
  x:runner.x+(size.w-w)/2,
  y:GROUND-runner.y-h,
  w:w,
  h:h
 };
}



const MAX_LEVEL=500;
const themes=[
 ["forest","الغابة", "#65bafa","#e2ffd8","#74b94d","#34763b"],
 ["village","القرية","#87ccff","#ffe6b4","#d4af72","#96703e"],
 ["city","المدينة","#64b1ef","#e6eaf5","#aebdce","#536477"],
 ["road","الطريق الداخلية","#90c9ec","#f6edce","#90989e","#414e57"],
 ["highway","الطريق السريعة","#8abfe5","#e6f2ff","#777e89","#3a414d"],
 ["water","عالم الماء","#075d9b","#49c8c8","#64bcb8","#276c78"],
 ["tunnel","الأنفاق","#24283d","#655b69","#a49a93","#58515d"],
 ["desert","الصحراء","#f0b265","#fff0ba","#f3ce7c","#ad7839"],
 ["mountain","الجبال","#78b0d9","#eaf5ff","#c2d6df","#677a85"],
 ["garden","الحدائق","#82d8c7","#f1ffe6","#8ed34b","#398143"]
];
function seededLevel(n){let a=(n*2654435761)>>>0;return ()=>{a=(Math.imul(a,1664525)+1013904223)>>>0;return a/4294967296;};}
function buildLevel(n){
 const random=seededLevel(n),pick=(a,b)=>a+random()*(b-a),d=Math.pow((n-1)/499,.38);
 const theme=themes[Math.floor((n-1)/2)%themes.length],night=n%4>=2;
 const ground=[],foes=[],gems=[],bonuses=[],chests=[];
 let x=0;const sections=4+Math.floor(d*8)+Math.floor(random()*2);
 for(let i=0;i<sections;i++){
  const w=Math.round(pick(610,790)+d*80);ground.push({x,y:GROUND,w,h:90});
  const count=i===0?0:1+Math.floor(d*2)+(random()<d*.45?1:0);
  for(let j=0;j<count;j++){
   const at=x+140+(w-270)*(j+.5)/count;
   const kind=(n>=2&&j===0&&(i%2===0||i===1))||(n>=12&&random()<.30+d*.18)?"bar":n>3&&random()<.18+d*.16?"spikes":"walker";
   foes.push({x:at,origin:at,y:kind==="bar"?GROUND-155:GROUND-(kind==="spikes"?30:42),w:kind==="bar"?Math.round(85+d*45):kind==="spikes"?48:42,h:kind==="bar"?95:kind==="spikes"?30:42,phase:random()*6.28,kind,pace:1.2+d*3.8+random()*.5,range:16+d*30});
  }
  const pc=2+Math.floor(random()*3);
  for(let j=0;j<pc;j++){
   const px=x+90+j*(w-210)/pc,py=GROUND-Math.round(pick(70,150)+d*25),pw=Math.round(pick(95,145)-d*25);
   ground.push({x:px,y:py,w:pw,h:24});
   gems.push({x:px+pw/2,y:py-32,r:15});
  }
  gems.push({x:x+w-65,y:GROUND-38,r:15});
  if(i===1&&n%3!==0)bonuses.push({x:x+110,y:GROUND-40,kind:"fire",id:i});if(i===0&&n%4===0)bonuses.push({x:x+220,y:GROUND-40,kind:"shield",id:i});
  if(i>0){bonuses.push({x:x+60,y:GROUND-40,kind:"key",id:i});} if(i===sections-2){chests.push({x:x+w-80,y:GROUND-48,cost:n%10===0?5:n%3===0?3:1});}
  const gap=i===sections-1?0:Math.round(pick(65,95)+d*35);
  x+=w+gap;
 }
 return {theme,night,ground,foes,gems,bonuses,chests,goal:x-100};
}

function reset(){
 level=Math.max(1,Math.min(MAX_LEVEL,Math.floor(saved.level||1)));worldX=100;feet=GROUND;vy=0;grounded=true;camera=0;clock=elapsed=score=distance=0;held.clear();shots=[];particles=[];fireUntil=0;shield=false;lastFire=-10;keysFound=saved.keys;saved.ammo=0;saved.ammoMask=0;rewardUntil=0;$("rewardHud").style.display="none";save();magnetUntil=flightUntil=armorUntil=0;
 if(saved.claimedLevel!==level){saved.claimedLevel=level;saved.claimedMask=0;saved.ammoMask=0;save();}
 const map=buildLevel(level);worldTheme=map.theme;night=map.night;terrain=map.ground;hazards=map.foes;stars=map.gems;powerups=map.bonuses;treasures=map.chests;goal=map.goal;runner.x=worldX-55;runner.y=0;
}
function start(){reset();mode="running";$("message").textContent=worldTheme[1]+(night?" — ليلًا":" — نهارًا")+" · اجمع النجوم وانخفض تحت الحواجز المعلّقة!";}
function jump(){if(mode==="running"&&grounded){vy=worldTheme[0]==="water"?-560:-740;grounded=false;}}
function pause(){if(mode==="running"){mode="paused";held.clear();}else if(mode==="paused")mode="running";}
function overlap(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}
function crash(){if(saved.extra>0){saved.extra--;save();worldX=100;feet=GROUND;vy=0;grounded=true;held.clear();armorUntil=clock+3;$("message").textContent="استعملت فرصة إضافية";return;}mode="crashed";held.clear();$("message").textContent="حاول مجددًا!";}
let magnetUntil=0,flightUntil=0,armorUntil=0,rewardUntil=0;
const items=[["extra","فرصة إضافية"],["armor","درع"],["magnet","مغناطيس"],["ammo","ذخيرة"],["flight","طيران"],["jewels","جواهر"]];
function renderBag(){ $("stageKeys").textContent="🔑 "+(saved.claimedMask&1048575).toString(2).replace(/0/g,"").length; if(clock>=rewardUntil)$("rewardHud").style.display="none"; $("bagKeys").textContent="🔑 "+saved.keys; for(const [k,label] of items){let b=$("bag-"+k);if(!b){b=document.createElement("button");b.id="bag-"+k;b.type="button";$("bag").append(b);b.onclick=()=>useItem(k);}b.textContent=label+" : "+saved[k];b.disabled=!saved[k]||k==="extra"||k==="jewels"||k==="ammo";}}
function useItem(k){if((mode!=="running"&&!(mode==="paused"&&bagResume))||!saved[k]||k==="ammo")return;saved[k]--;if(k==="armor")armorUntil=clock+15;if(k==="magnet")magnetUntil=clock+20;if(k==="flight")flightUntil=clock+10;save();renderBag();}
let bagResume=false;
function closeBag(){ $("bagPanel").hidden=true;if(bagResume&&mode==="paused")mode="running";bagResume=false; }
$("openBag").onclick=()=>{if(!$("bagPanel").hidden){closeBag();return;}bagResume=mode==="running";if(bagResume){mode="paused";held.clear();}renderBag();$("bagPanel").hidden=false;};
$("closeBag").onclick=closeBag;
$("buyArmor").onclick=()=>{if(saved.jewels>=2){saved.jewels-=2;saved.armor++;save();renderBag();}};

const runningSheet=new Image();
runningSheet.src="mohammad-running-frames.png";
const RUN_FRAMES=8;

const spriteBounds={};

const runFrameBounds=[];
let runUniformScale=1;

function prepareRunningFrames(){
 if(!runningSheet.complete||!runningSheet.naturalWidth)return;

 const fw=runningSheet.naturalWidth/RUN_FRAMES;
 const fh=runningSheet.naturalHeight;

 const c=document.createElement("canvas");
 c.width=runningSheet.naturalWidth;
 c.height=fh;

 const g=c.getContext("2d",{willReadFrequently:true});
 g.drawImage(runningSheet,0,0);

 const pixels=g.getImageData(0,0,c.width,c.height).data;

 runFrameBounds.length=0;

 for(let frame=0;frame<RUN_FRAMES;frame++){
  const x0=Math.round(frame*fw);
  const x1=Math.round((frame+1)*fw);

  let left=x1,top=fh,right=-1,bottom=-1;

  for(let y=0;y<fh;y++){
   for(let x=x0;x<x1;x++){
    if(pixels[(y*c.width+x)*4+3]>30){
     left=Math.min(left,x);
     right=Math.max(right,x);
     top=Math.min(top,y);
     bottom=Math.max(bottom,y);
    }
   }
  }

  if(right>=left){
   runFrameBounds.push({
    x:left,y:top,
    w:right-left+1,
    h:bottom-top+1
   });
  }else{
   runFrameBounds.push({
    x:x0,y:0,w:x1-x0,h:fh
   });
  }
 }

 const maxW=Math.max(...runFrameBounds.map(b=>b.w));
 const maxH=Math.max(...runFrameBounds.map(b=>b.h));

 runUniformScale=Math.min(
  CHARACTER.run.w/maxW,
  CHARACTER.run.h/maxH
 );

}

if(runningSheet.complete&&runningSheet.naturalWidth){
 prepareRunningFrames();
}else{
 runningSheet.addEventListener(
  "load",prepareRunningFrames,{once:true}
 );
}


function getSpriteBounds(img,pose){
 if(spriteBounds[pose])return spriteBounds[pose];

 const c=document.createElement("canvas");
 c.width=img.naturalWidth;
 c.height=img.naturalHeight;
 const g=c.getContext("2d",{willReadFrequently:true});
 g.drawImage(img,0,0);

 const data=g.getImageData(0,0,c.width,c.height).data;
 let left=c.width,top=c.height,right=-1,bottom=-1;

 for(let y=0;y<c.height;y++){
  for(let x=0;x<c.width;x++){
   if(data[(y*c.width+x)*4+3]>25){
    left=Math.min(left,x);
    right=Math.max(right,x);
    top=Math.min(top,y);
    bottom=Math.max(bottom,y);
   }
  }
 }

 const bounds=right>=left
  ?{x:left,y:top,w:right-left+1,h:bottom-top+1}
  :{x:0,y:0,w:c.width,h:c.height};

 spriteBounds[pose]=bounds;
 return bounds;
}

function drawMohammad(){
 const pose=characterPose();
 const size=CHARACTER[pose];
 const footY=GROUND-runner.y+2;
 const centerX=runner.x+55;

 ctx.globalAlpha=.16;
 ctx.fillStyle="#000";

 if(selectedCharacter==="habiba"&&drawHabibaSheet(pose,centerX,footY))return;
 if(selectedCharacter==="mohammad"&&pose==="run"&&runningSheet.complete&&runningSheet.naturalWidth>0){
  const ratio=Math.max(1,Math.min(10,speed/235));
  const fps=6+ratio*1.2;
  const frame=(held.has("left")||held.has("right"))?Math.floor(clock*fps)%(RUN_FRAMES-1):0;

  const bounds=runFrameBounds[frame];

  if(bounds){
   const w=bounds.w*runUniformScale;
   const h=bounds.h*runUniformScale;

   ctx.drawImage(
    runningSheet,
    bounds.x,bounds.y,bounds.w,bounds.h,
    centerX-w/2,footY-h,w,h
   );
   return;
  }
 }

 const img=selectedCharacter==="habiba"?habibaImages[pose]:mohammadImages[pose];
 if(selectedCharacter==="habiba"&&!(img.complete&&img.naturalWidth>0)){drawHabibaFallback(pose,centerX,footY);return;}

 if(img.complete&&img.naturalWidth>0){
  const key=selectedCharacter==="habiba"?"habiba-"+pose:pose;
  const bounds=spriteBounds[key]||getSpriteBounds(img,key);
  const scale=Math.min(
   size.w/bounds.w,
   size.h/bounds.h
  );

  const w=bounds.w*scale;
  const h=bounds.h*scale;

  ctx.drawImage(
   img,
   bounds.x,bounds.y,bounds.w,bounds.h,
   centerX-w/2,footY-h,w,h
  );
 }else{
  ctx.fillStyle="#28458f";
  ctx.fillRect(
   centerX-size.w/2,
   footY-size.h,
   size.w,size.h
  );
 }
}

  ctx.fillRect(0,0,W,GROUND);
  ctx.textAlign="center";
  ctx.fillStyle="white";
  ctx.font="bold 40px Tahoma,Arial";
  const labels={
   ready:gameText("m5"),
   paused:gameText("m6"),
   crashed:gameText("m7"),won:"أحسنت!"
  };
  ctx.fillText(labels[mode]||"",W/2,105);
 }

 (($("distance")) || {textContent:""}).textContent=Math.floor(distance);
 (($("stars")) || {textContent:""}).textContent=score+" ⭐";renderBag();
 (($("speed")) || {textContent:""}).textContent=level+" / "+MAX_LEVEL;
 const seconds=Math.floor(elapsed);
 (($("time")) || {textContent:""}).textContent=
  String(Math.floor(seconds/60)).padStart(2,"0")+":"+
  String(seconds%60).padStart(2,"0");
 (($("record")) || {textContent:""}).textContent=Math.floor(saved.distance);
 (($("starRecord")) || {textContent:""}).textContent=saved.starRecord+" ⭐";
 (($("totalStars")) || {textContent:""}).textContent=saved.totalStars+" ⭐";
 document.querySelectorAll("[data-character]").forEach(b=>b.disabled=mode==="running"||mode==="paused");
 $("start").hidden=mode==="running"||mode==="paused"||(mode==="won"&&level===MAX_LEVEL);$("start").textContent=mode==="won"?"المرحلة التالية":mode==="crashed"?"حاول مجددًا":"▶ ابدأ";$("pause").disabled=mode!=="running"&&mode!=="paused";$("fire").disabled=mode!=="running"||saved.ammo<1;$("fire").textContent="🔥 "+saved.ammo;
 (($("pause")) || {textContent:""}).textContent=mode==="paused"?gameText("m9"):gameText("m10");
}

function loop(now){
 requestAnimationFrame(loop);
 try{
  const dt=last?Math.min(.04,(now-last)/1000):0;
  last=now;
  for(let left=dt;left>0;left-=1/120)update(Math.min(left,1/120));
  draw();
 }catch(error){
  console.error("Game loop error:",error);
  const message=document.getElementById("message");
  if(message){
   message.textContent=gameText("m8")+error.message;
  }
 }
}

document.querySelectorAll('[data-character]').forEach(b=>b.onclick=()=>{
 if(mode==="running"||mode==="paused")return;
 selectedCharacter=b.dataset.character;
 document.querySelectorAll('[data-character]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
});
$("start").onclick=start;
$("pause").onclick=pause;$("fire").onclick=fire;

const keys={ArrowLeft:"left",KeyA:"left",ArrowRight:"right",KeyD:"right",ArrowDown:"down",KeyS:"down"};
document.addEventListener("keydown",e=>{if(keys[e.code]){e.preventDefault();held.add(keys[e.code]);}if(["ArrowUp","KeyW","Space"].includes(e.code)){e.preventDefault();if(!e.repeat)jump();}if(e.code==="KeyF"&&!e.repeat)fire();});
document.addEventListener("keyup",e=>{if(keys[e.code])held.delete(keys[e.code]);});
for(const id of ["left","right","up","down"]){const button=$(id);button.addEventListener("pointerdown",e=>{e.preventDefault();button.setPointerCapture(e.pointerId);if(id==="up")jump();else held.add(id);});for(const event of ["pointerup","pointercancel","lostpointercapture"])button.addEventListener(event,()=>held.delete(id));}
window.addEventListener("blur",()=>{held.clear();if(mode==="running")pause();});
function resizeHD(){const ratio=Math.min(2,Math.max(1,window.devicePixelRatio||1));canvas.width=W*ratio;canvas.height=H*ratio;ctx.setTransform(ratio,0,0,ratio,0,0);}resizeHD();window.addEventListener("resize",resizeHD);
reset();
requestAnimationFrame(loop);
</script>
