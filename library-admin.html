<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المكتبة</title><style>body{margin:0;background:#fff5e3;color:#463426;font:16px Tahoma,Arial}main{max-width:800px;margin:auto;padding:16px}form,article{background:white;padding:18px;border-radius:16px;margin:12px 0}label{display:block;margin:10px 0}input,textarea,select,button{box-sizing:border-box;font:inherit;padding:10px;border:1px solid #e6ad65;border-radius:10px}input:not([type=checkbox]),textarea,select{width:100%}button{background:#ffdfa9;cursor:pointer}</style><main><h1>إدارة المكتبة</h1><p id="status" role="status">جار التحقق من الصلاحيات…</p><div id="admin" hidden><form id="series"><h2>السلاسل</h2><label>اسم السلسلة<input name="title" required maxlength="120"></label><label>الترتيب<input name="order" type="number" value="0" required></label><label><input name="published" type="checkbox" checked> منشورة</label><button>حفظ السلسلة</button><button type="reset">إلغاء التعديل</button></form><div id="seriesList"></div><form id="book"><h2>الكتب</h2><label>اسم الكتاب<input name="title" required maxlength="150"></label><label>السلسلة<select name="seriesId" required></select></label><label>الوصف<textarea name="description" maxlength="2000"></textarea></label><label>الترتيب<input name="order" type="number" value="0" required></label><label><input name="published" type="checkbox"> منشور</label><button>حفظ بيانات الكتاب</button><button type="reset">إلغاء التعديل</button><p>رفع الملفات غير متاح بعد.</p></form><div id="bookList"></div></div></main><script type="module" src="auth/navigation.js?v=20261126a"></script><script type="module">
import {connect} from './auth/firebase.js';
const $=id=>document.getElementById(id);let stops=[],series=[],books=[],epoch=0;
try{const {auth,authApi,data,db}=await connect();authApi.onAuthStateChanged(auth,async user=>{const turn=++epoch;stops.forEach(f=>f());stops=[];$('admin').hidden=true;if(!user?.emailVerified){$('status').textContent='هذه الصفحة للمدير فقط';return}try{const role=user.email==='quraaty@gmail.com'?'admin':(await data.getDoc(data.doc(db,'roles',user.uid))).data()?.role;if(turn!==epoch)return;if(role!=='admin'){$('status').textContent='هذه الصفحة للمدير فقط';return}$('admin').hidden=false;$('status').textContent='';for(const [kind,collection,list] of [['series','librarySeries','seriesList'],['book','libraryBooks','bookList']]){const form=$(kind);form.reset();delete form.dataset.id;form.onreset=()=>delete form.dataset.id;form.onsubmit=async e=>{e.preventDefault();if(turn!==epoch)return;const f=new FormData(form),value={title:String(f.get('title')).trim(),order:Number(f.get('order')),published:f.has('published')};if(!value.title)return;if(kind==='book'){const s=series.find(s=>s.id===f.get('seriesId'));if(!s)return;Object.assign(value,{seriesId:s.id,series:s.title,description:String(f.get('description'))});if(value.published){$('status').textContent='لا يمكن نشر كتاب قبل تجهيز رفع الملفات';return}}try{if(form.dataset.id)await data.updateDoc(data.doc(db,collection,form.dataset.id),value);else await data.addDoc(data.collection(db,collection),value);form.reset();$('status').textContent='تم الحفظ'}catch{$('status').textContent='تعذر الحفظ؛ تحقق من قواعد Firebase'}};stops.push(data.onSnapshot(data.collection(db,collection),snap=>{const rows=snap.docs.map(d=>({...d.data(),id:d.id})).sort((a,b)=>a.order-b.order);if(kind==='series'){series=rows;const select=$('book').elements.seriesId,previous=select.value;select.replaceChildren(...rows.map(s=>new Option(s.title,s.id)));select.value=previous||rows[0]?.id||''}else books=rows;$(list).replaceChildren();for(const row of rows){const card=document.createElement('article'),name=document.createElement('p');name.textContent=row.title+' · '+(row.published?'منشور':'مخفي');card.append(name);for(const [label,fn] of [['تعديل',()=>{form.dataset.id=row.id;for(const key of ['title','order','description','seriesId'])if(form.elements[key])form.elements[key].value=row[key]??'';form.elements.published.checked=!!row.published;form.scrollIntoView()}],['حذف',async()=>{if(kind==='series'&&books.some(b=>b.seriesId===row.id)){ $('status').textContent='انقل كتب السلسلة أولًا';return}if(confirm('حذف '+row.title+'؟'))try{await data.deleteDoc(data.doc(db,collection,row.id));$('status').textContent='تم الحذف'}catch{$('status').textContent='تعذر الحذف'}}]]){const b=document.createElement('button');b.textContent=label;b.onclick=fn;card.append(b)}$(list).append(card)}},()=>{$('status').textContent='تعذر تحميل البيانات؛ تحقق من نشر قواعد Firebase'}))}}catch{$('status').textContent='تعذر التحقق من الصلاحيات'}})}catch{$('status').textContent='تعذر الاتصال'}
</script></html>
