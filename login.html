<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:grid;place-items:center;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(#fff0cf,#fff9ef);
  color:#463426;padding:18px
}
.card{
  width:min(100%,420px);background:white;
  padding:28px;border-radius:24px;
  border:2px solid #f4a144;
  box-shadow:0 8px 25px #71441520
}
.logo{display:block;width:180px;max-width:80%;margin:0 auto}
h1{text-align:center;font-size:25px}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{
  width:100%;padding:14px;border:1px solid #ddc8ad;
  border-radius:12px;font:inherit;direction:ltr;
  text-align:left
}
button{
  width:100%;margin-top:22px;padding:14px;
  border:0;border-radius:13px;background:#f5a449;
  font:inherit;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
#message{text-align:center;min-height:25px;margin-top:15px}
a{display:block;text-align:center;margin-top:16px;color:#77522f}
</style>
</head>
<body>
<div class="card">
<img class="logo" src="mohammad-habiba-logo.png" alt="محمد وحبيبة">
<h1>تسجيل الدخول</h1>
<form id="loginForm" hidden>
<label for="email">البريد الإلكتروني للعائلة</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button type="submit" value="signin">دخول</button>
<button type="submit" value="register">إنشاء حساب عائلي</button>
</form>
<div id="family" hidden>
<h2>ملفات الأولاد</h2>
<div id="profiles"></div>
<form id="profileForm">
<label for="childName">اسم الملف</label>
<input id="childName" maxlength="40" dir="rtl" required>
<button type="submit">إضافة ملف</button>
</form>
</div>
<div id="verify" hidden>
<button id="checkEmail">تحقّقت من بريدي</button>
<button id="sendEmail">إرسال رابط التحقّق</button>
</div>
<button id="signOut" hidden>تسجيل الخروج</button>
<p id="message" role="status"></p>
<a href="index.html">العودة إلى الصفحة الرئيسية</a>
</div>
<script type="module" src="auth/family.js"></script>
</body>
</html>
