<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تسجيل الدخول | محمد وحبيبة</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  font-family:Tahoma,Arial,sans-serif;
  background:linear-gradient(#fff0cf,#fff9ef);
  color:#463426;padding:0
}
.card{
  width:min(calc(100% - 32px),420px);margin:24px auto 32px;flex-shrink:0;background:white;
  padding:28px;border-radius:24px;
  border:2px solid #f4a144;
  box-shadow:0 8px 25px #71441520
}
.logo{display:block;width:180px;max-width:80%;margin:0 auto}
h1{text-align:center;font-size:25px}
label{display:block;margin:18px 0 7px;font-weight:bold}
input{
  width:100%;padding:14px;border:1px solid #ddc8ad;
  border-radius:12px;font:inherit;direction:ltr;
  text-align:left
}
button{
  width:100%;margin-top:22px;padding:14px;
  border:0;border-radius:13px;background:#f5a449;
  font:inherit;font-weight:bold;cursor:pointer
}
button:disabled{opacity:.6}
button[aria-current=true]{outline:3px solid #77522f}
#message{text-align:center;min-height:25px;margin-top:15px}
a{display:block;text-align:center;margin-top:16px;color:#77522f}
select{width:100%;padding:14px;border:1px solid #ddc8ad;border-radius:12px;font:inherit}input:not([type=email]):not([type=password]):not([type=date]){direction:rtl;text-align:right}[hidden]{display:none!important}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px}.auth-tabs button{margin:0;background:#fff1d9;border:1px solid #e6b77c}.auth-tabs button[aria-pressed=true]{background:#f5a449;outline:2px solid #8c561d}#parentNotice{font-size:14px;line-height:1.7}#parentNotice a{display:inline;margin:0}
</style>
</head>
<body>
<div class="card">
<a href="index.html"><img class="logo" src="mohammad-habiba-logo.png" alt="محمد وحبيبة"></a>
<h1 id="authHeading">تسجيل الدخول</h1>
<form id="loginForm" hidden>
<div class="auth-tabs" role="group" aria-label="نوع الحساب"><button type="button" id="signinTab" aria-pressed="true">تسجيل دخول</button><button type="button" id="registerTab" aria-pressed="false">حساب جديد</button></div>
<p id="parentNotice" hidden>إنشاء الحساب مخصص لولي الأمر. <a href="privacy.html">سياسة الخصوصية</a></p>
<label for="email">البريد الإلكتروني للعائلة</label>
<input id="email" type="email" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" type="password" autocomplete="current-password" required>
<button id="authSubmit" type="submit" value="signin">تسجيل دخول</button>
<button type="button" id="resetPassword">نسيت كلمة المرور؟</button>

</form>
<div id="family" hidden>
<h2>من يستخدم التطبيق؟</h2>
<form id="countryForm" hidden>
  <label for="country">بلد التسجيل</label>
  <select id="country" required><option value="">اختر البلد</option></select>
  <button type="submit">حفظ البلد</button>
</form>
<div id="profiles"></div>
<form id="profileForm">
<h3 id="childTitle">ملف الولد الأول</h3><label for="childName">الاسم</label><input id="childName" maxlength="40" required><label for="lastName">اسم العائلة</label><input id="lastName" maxlength="40" required><label for="gender">الجنس</label><select id="gender" required><option value="">اختر</option><option value="male">ذكر</option><option value="female">أنثى</option></select><label for="birthDate">تاريخ الميلاد</label><input id="birthDate" type="date" required><button type="submit" id="addChild">إضافة الولد</button></form><button id="finish" hidden type="button">أنهيت</button>
</div>
<div id="verify" hidden>
<button id="checkEmail">تحقّقت من بريدي</button>
<button id="sendEmail">إرسال رابط التحقّق</button>
</div>
<button id="signOut" hidden>تسجيل الخروج</button>
<p id="message" role="status"></p>
<a href="privacy.html">سياسة الخصوصية</a>

</div>
<script>
(()=>{const get=id=>document.getElementById(id);function mode(register){get('signinTab').setAttribute('aria-pressed',String(!register));get('registerTab').setAttribute('aria-pressed',String(register));get('authHeading').textContent=register?'حساب جديد':'تسجيل الدخول';get('authSubmit').value=register?'register':'signin';get('authSubmit').textContent=register?'إنشاء حساب':'تسجيل دخول';get('password').autocomplete=register?'new-password':'current-password';get('password').minLength=register?6:0;get('password').value='';get('resetPassword').hidden=register;get('parentNotice').hidden=!register;get('message').textContent='';}get('signinTab').onclick=()=>mode(false);get('registerTab').onclick=()=>mode(true);})();
</script>
<script type="module" src="auth/family.js"></script>
<script type="module" src="auth/navigation.js?v=20261125b"></script>
</body>
</html>
