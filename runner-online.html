<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>تحدي الحواجز | محمد وحبيبة</title><link rel="stylesheet" href="runner/runner.css">
<style>.online-panel{background:#fff;border:1px solid #dfd6c5;border-radius:16px;padding:16px;margin:12px 0}.online-panel button{margin:4px}.online-panel input{font:inherit;padding:8px;max-width:100%}#offers>div{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:8px}#messages{min-height:48px;max-height:130px;overflow:auto}#onlineHud{position:absolute;top:12px;inset-inline:12px;background:#092b38e8;color:white;border-radius:12px;padding:10px;text-align:center}#onlinePad{position:absolute;bottom:10px;left:10px;right:10px;display:flex;justify-content:center;gap:6px;direction:ltr}#onlinePad button{min-width:48px;min-height:48px;font-size:20px}#phraseRows>div{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0}</style>
<main class="runner"><div class="runner-heading"><a href="runner.html">سباق النجوم</a><h1>تحدي الحواجز</h1></div>
<p id="status" role="status">جارٍ الاتصال...</p>
<section id="lobby" class="online-panel" hidden><p>اختر منافسًا أو أرسل طلبًا للعب. لا تظهر معلوماتك الشخصية.</p><button id="invite" class="primary">من يلعب معي؟</button><button id="cancel" hidden>إلغاء الطلب</button><div id="offers"></div></section>
<section id="track" hidden><canvas id="world"></canvas><canvas id="worldFallback" hidden></canvas><div id="onlineHud"></div><div id="onlinePad"><button data-move="left">←</button><button data-move="jump">↑</button><button data-move="down">↓</button><button data-move="right">→</button></div></section>
<section id="chat" class="online-panel" hidden><h2>المحادثة</h2><div id="messages" aria-live="polite"></div><div id="phrases"></div><button id="leave">مغادرة الجولة</button></section>
<section id="editor" class="online-panel" hidden><h2>إدارة عبارات المحادثة</h2><div id="phraseRows"></div><button id="addPhrase">إضافة عبارة</button><button id="savePhrases" class="primary">حفظ العبارات</button></section>
</main><script type="module" src="runner/online.js"></script><script type="module" src="auth/navigation.js"></script></html>
